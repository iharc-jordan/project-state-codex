pack:
  id: "client-services"
  name: "Client Services Engagement"
  version: "0.1.0-starter"
  compatible_core: ">=2.0,<3.0"
  description: |
    Pack for consulting/client-engagement projects. Configures the suite to handle
    Statements of Work, milestone-based customer billing, customer change orders
    against contract scope, customer-facing QBRs, customer signoff gates on
    deliverables, monthly invoicing cadence, post-engagement support windows.
  authors:
    - "David Olsson <david@atomic47.co>"
  released: "2026-04-27"
  maturity: "starter — proven shape, adapt to your client contract"

provides:
  profiles:
    - funder-reporting   # customer plays the funder role here
    - review-meeting     # QBR
    - external-comms     # customer-confidentiality review
    - archive            # engagement wrap
  templates:
    - invoice-cover-email.md
    - qbr-pack.md
    - engagement-final-deliverable.md
  reporting_matrix_defaults: true

depends_on:
  packs: []

conflicts_with:
  packs: []   # coexists with PIC pack (a project can have a funder + a customer)

# ----------------------------------------------------------------------------
# Defaults this pack suggests to a facility that loads it
# ----------------------------------------------------------------------------
# lifecycle is a SUGGESTION, not a setting. project-onboarding uses it to pre-fill its
# "does this project end?" question as a confirmation rather than a blank interview, and the
# facility's own manifest.yaml:phases.lifecycle always wins. Nothing is ever written blind, and
# a facility that leaves its lifecycle unset stays permanently valid.
# Resolution order: facility > pack default > terminal.
# Lifecycle behavior is enforced by project-phase-gate and the selected preset.
defaults:
  # Retainers renew and follow-on SOWs land against the same customer, the same risk register,
  # and the same people. client-engagement-default cycles 04-wrap -> 03-engagement and keeps
  # 05-archive for when the relationship actually ends.
  lifecycle: continuous
