pack:
  id: "work-research"
  name: "Research or Study"
  version: "0.1.0"
  compatible_core: ">=4.0,<5.0"
  description: |
    Work type for a research project, study, evaluation or investigation that is not driven by a
    funder's rules (pair it with a funder pack when it is). Stage-gate ladder read as questions →
    method → data collection → analysis → findings, with ethics and data-quality risks seeded.
  authors:
    - "David Olsson <david@atomic47.co>"
  governing_documents:
    - "docs/PROJECT-TYPES-SPEC.md section 8 — second-wave work types"
    - "templates/phase-presets/stage-gate-default.yaml — the phase ladder this pack assumes"
  released: "2026-09-24"
  maturity: "starter"
  axis: work   # work | accountability | capability - PROJECT-TYPES-SPEC section 3

# ----------------------------------------------------------------------------
# Picker presentation - docs/PROJECT-TYPES-SPEC.md section 5. Every front door (onboarding,
# scaffolder, intake, kanban wizard) reads this block; none keeps its own table of packs.
# ----------------------------------------------------------------------------
picker:
  listed: true
  label: "Research or study"
  blurb: "A study, evaluation or investigation: questions, method, data, analysis, findings."
  signals:
    - "research"
    - "study"
    - "evaluation"
    - "investigation"
    - "survey"
    - "experiment"
    - "pilot study"
    - "literature review"
    - "findings"
    - "hypothesis"
    - "participants"
    - "data collection"

provides:
  profiles: []
  seeds: [milestones, risks, kpis]
  reporting_matrix_defaults: true

depends_on:
  packs: []

conflicts_with:
  packs: []

# Onboarding asks these after the rhythm question (PROJECT-TYPES-SPEC section 7.1 step 4).
asks:
  - key: project.end_date
    prompt: "When are the findings due?"
    required: true

# ----------------------------------------------------------------------------
# Defaults this pack suggests (suggestions, never settings; the facility's manifest wins).
# ----------------------------------------------------------------------------
defaults:
  lifecycle: terminal
  preset: stage-gate-default
