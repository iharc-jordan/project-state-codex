# Pack: PIC PCAIS — Protein Industries Canada (Protein Consortia AI Stream)
#
# Reproduces v1.x behavior of the suite for a PIC PCAIS-funded consortium project.
# Loading this pack alone gives you the full v1.x experience.
#
# Compatible cores: 2.0+
# Pack version: 1.0.0

pack:
  id: "pic-pcais"
  name: "Protein Industries Canada — PCAIS"
  version: "1.0.0"
  compatible_core: ">=4.0,<5.0"
  description: |
    Funder pack for Protein Industries Canada PCAIS-funded consortium projects.
    Encodes PIC PM Guide requirements: quarterly claim cadence (Apr/Jul/Oct/Jan 20),
    Steering Committee lifecycle per Appendix A, MPA-mandated 30/14-day publication
    review, IP routing to PIC Director of Data and IP, six-phase project lifecycle
    (LOI → Approval → Planning → Execution → Closeout → Archive), final reporting
    workflow with 90-day pre-close template distribution and 30-day post-close
    finalization, FTE confirmation, holdback release tracking.
  authors:
    - "David Olsson <david@atomic47.co>"
  governing_documents:
    - "PIC PM Guide (Protein Industries Canada Project Management Guide)"
    - "Master Project Agreement template"
  released: "2026-04-27"
  maturity: "production"
  axis: accountability   # work | accountability | capability - PROJECT-TYPES-SPEC section 3

# ----------------------------------------------------------------------------
# Picker presentation - docs/PROJECT-TYPES-SPEC.md section 5. Every front door (onboarding,
# scaffolder, intake, kanban wizard) reads this block; none keeps its own table of packs.
# ----------------------------------------------------------------------------
picker:
  listed: true
  label: "Protein Industries Canada (PCAIS)"
  blurb: "PIC-funded consortium: quarterly claims, Steering Committee, publication and IP review."
  signals:
    - "Protein Industries Canada"
    - "PCAIS"
    - "PIC PM Guide"
    - "Master Project Agreement"

provides:
  profiles:
    - funder-reporting
    - review-meeting
    - external-comms
    - ip-tracker
    - archive
    - phase-gate
    - onepager             # audience voice profiles for project-onepager — shipped since the
                           # onepager skill landed but never declared here until 2026-08-21
  templates:
    - claim-cover-email.md
    - sc-agenda-appendix-a.md
    - sc-minutes.md
    - ip-disclosure.md
    - pic-ip-registry-abstract.md
    - pic-annual-questionnaire-ip-section.md
    - lessons-learned-summary.md
    - pic-ip-final-report.md
    # final-report.md and publication-review-form.md were declared here with no files and no
    # profile referencing either — trimmed 2026-08-21 (FB-014 / issue #17). The member final
    # report is real but PIC distributes its template ~90 days before project close (PM Guide,
    # "Project Closure and Final Reporting") — it is facility-supplied when issued, not
    # pack-shipped. Publication review is governed by the PM Guide's 30-day/14-day SC review
    # windows; author a form and re-declare it in the same change if one is wanted.
  reporting_matrix_defaults: true

depends_on:
  packs: []     # standalone

conflicts_with:
  packs: []     # PIC pack is compatible with any non-PIC funder/customer pack
                # (they declare different stakeholders + different reporting matrix entries)

# ----------------------------------------------------------------------------
# Defaults this pack suggests to a facility that loads it
# ----------------------------------------------------------------------------
# lifecycle is a SUGGESTION, not a setting. project-onboarding uses it to pre-fill its
# "does this project end?" question as a confirmation rather than a blank interview, and the
# facility's own manifest.yaml:phases.lifecycle always wins. Nothing is ever written blind, and
# a facility that leaves its lifecycle unset stays permanently valid.
# Resolution order: facility > pack default > terminal.
# Spec: docs/CONTINUOUS-LIFECYCLE-SPEC.md section 4.1
defaults:
  # An MPA has an end date, a final report, and a holdback release. Structurally barred
  # from continuous anyway: grant-default declares no cycles_back_to.
  lifecycle: terminal
  # preset is a suggestion too: it pre-fills the rhythm question and project-scaffolder Step 2
  # resolution step 2. The facility\'s phases.preset always wins.
  preset: grant-default
