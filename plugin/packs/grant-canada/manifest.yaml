# Pack: grant-canada — Canadian Grant Submission Lifecycle
#
# Adds pre-award grant submission facilities (grant-state/) to project-state.
# Covers 19 Canadian programs. On award, freezes submission and spawns a
# sibling project-state/ carrying forward people, IP, gates, and milestones.
#
# Compatible cores: 3.0+
# Pack version: 1.0.0

pack:
  id: "grant-canada"
  name: "Canadian Grant Submission"
  version: "1.0.0"
  compatible_core: ">=3.0"
  description: |
    Canadian grant submission lifecycle for project-state. Adds a pre-award
    grant-state/ facility kind and three skills (grant-state, grant-scaffolder,
    grant-ingestor) covering 19 major Canadian programs: Tri-Council
    (NSERC/SSHRC/CIHR), IRAP, SIF, PIC, CFI JELF, Mitacs Accelerate,
    NGen, SCALE.AI, Genome Canada, regional development agencies (PacifiCan,
    FedDev, FedNor, CED, ACOA, CanNor), SR&ED, and an agnostic-core fallback.

    Models 12 Canada-specific compliance gates (OCAP, GBA+, bilingual, TTO
    routing, stacking, IP declaration, Indigenous engagement, environmental,
    cost-share, ethics-REB, biosafety, data sovereignty) as first-class
    facility entities.

    On award: freezes the grant facility, spawns a sibling project-state/,
    and carries forward consortium people, IP rationale, gate snapshots,
    research facility, and re-baselined milestones.
  authors:
    - "David Olsson <david@atomic47.co>"
  governing_documents:
    - "Tri-Agency Guide on Financial Administration"
    - "NSERC Alliance Program Guide"
    - "IRAP Technical Review Guide"
    - "PIC PM Guide"
  released: "2026-05-18"
  maturity: "starter"
  axis: accountability   # work | accountability | capability - the bundled pack contract

# ----------------------------------------------------------------------------
# Picker presentation - skills/project-scaffolder/SKILL.md Every front door (onboarding,
# scaffolder, intake, kanban wizard) reads this block; none keeps its own table of packs.
# ----------------------------------------------------------------------------
picker:
  listed: true
  label: "Canadian grant"
  blurb: "Pre-award submission for NSERC, IRAP, SIF, CFI, Mitacs and 14 more Canadian programs."
  signals:
    - "NSERC"
    - "IRAP"
    - "Mitacs"
    - "CFI"
    - "SIF"
    - "SSHRC"
    - "CIHR"
    - "NGen"
    - "SCALE.AI"
    - "Genome Canada"
    - "grant application"

provides:
  facility_kinds:
    - grant-submission
  skill_namespaces:
    - grant-*
  profiles:
    - phase-gate
    - review-meeting
    - funder-reporting
    - external-comms
  # A templates: block declared eight files here — grant-manifest.yaml,
  # compliance-gates-canada.yaml, and a six-file submission-phases/ ladder. None ever shipped
  # (there is no templates/ directory) — trimmed 2026-08-21 (FB-014 / issue #17). If the
  # submission-phase ladder is built, re-declare each file in the change that adds it.
  reporting_matrix_defaults: true

depends_on:
  packs: []     # standalone; compatible with sred-canada (complementary)

conflicts_with:
  packs: []

# ----------------------------------------------------------------------------
# Defaults this pack suggests to a facility that loads it
# ----------------------------------------------------------------------------
# lifecycle is a SUGGESTION, not a setting. project-onboarding uses it to pre-fill its
# "does this project end?" question as a confirmation rather than a blank interview, and the
# facility's own manifest.yaml:phases.lifecycle always wins. Nothing is ever written blind, and
# a facility that leaves its lifecycle unset stays permanently valid.
# Resolution order: facility > pack default > terminal.
# Spec: skills/project-phase-gate/SKILL.md
defaults:
  # A grant ends: a deadline, a decision, and either an award or a rejection.
  # A grant project that continues is a new grant, not a new increment.
  lifecycle: terminal
  # preset is a suggestion too: it pre-fills the rhythm question and project-scaffolder Step 2
  # resolution step 2. The facility\'s phases.preset always wins.
  preset: grant-default
