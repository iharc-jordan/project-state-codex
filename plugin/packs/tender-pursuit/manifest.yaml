pack:
  id: "tender-pursuit"
  name: "Tender Pursuit Defaults"
  version: "1.0.0"
  compatible_core: ">=4.0,<5.0"
  description: |
    Pack for facilities running the tender-intelligence package. Configures the
    notifier's alert thresholds and immediate-alert rules, a weekly pipeline
    review meeting, and reporting-matrix lines for pipeline reporting. Pair with
    any other pack — tender pursuit composes with grant, client, or agile packs.
  authors:
    - "David Olsson <david@atomic47.co>"
  released: "2026-07-21"
  maturity: "stable"

provides:
  profiles:
    - notifier           # tender alert thresholds and rules
    - review-meeting     # weekly pipeline review
  reporting_matrix_defaults: true

requires:
  packages:
    - tender-intelligence

# ----------------------------------------------------------------------------
# Defaults this pack suggests to a facility that loads it
# ----------------------------------------------------------------------------
# lifecycle is a SUGGESTION, not a setting. project-onboarding uses it to pre-fill its
# "does this project end?" question as a confirmation rather than a blank interview, and the
# facility's own manifest.yaml:phases.lifecycle always wins. Nothing is ever written blind, and
# a facility that leaves its lifecycle unset stays permanently valid.
# Resolution order: facility > pack default > terminal.
# Lifecycle behavior is enforced by project-phase-gate and the selected preset.
defaults:
  # A pursuit ends when the tender is awarded or lost. The delivery project that may follow
  # is a different facility, not a later increment of the bid.
  lifecycle: terminal
