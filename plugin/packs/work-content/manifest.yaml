pack:
  id: "work-content"
  name: "Content or Publication"
  version: "0.1.0"
  compatible_core: ">=4.0,<5.0"
  description: |
    Work type for making and publishing content: a report, a book, a course, a video series, a
    website or documentation set. Countdown ladder anchored on the publish date: outline, draft, review,
    production, publish, then promotion and a results check.
  authors:
    - "David Olsson <david@atomic47.co>"
  governing_documents:
    - "docs/PROJECT-TYPES-SPEC.md section 8 — second-wave work types"
    - "templates/phase-presets/countdown-default.yaml — the phase ladder this pack assumes"
  released: "2026-09-24"
  maturity: "starter"
  axis: work   # work | accountability | capability - PROJECT-TYPES-SPEC section 3

# ----------------------------------------------------------------------------
# Picker presentation - docs/PROJECT-TYPES-SPEC.md section 5. Every front door (onboarding,
# scaffolder, intake, kanban wizard) reads this block; none keeps its own table of packs.
# ----------------------------------------------------------------------------
picker:
  listed: true
  label: "Content or publication"
  blurb: "A report, book, course, video series or website — planned back from a publish date."
  signals:
    - "annual report"
    - "whitepaper"
    - "book"
    - "course"
    - "video series"
    - "podcast"
    - "publication"
    - "publish"
    - "editorial"
    - "content series"
    - "documentation"
    - "newsletter"
    - "website relaunch"

provides:
  profiles: []
  seeds: [milestones, risks, kpis]
  reporting_matrix_defaults: true

depends_on:
  packs: []

conflicts_with:
  packs: []

# Onboarding asks these after the rhythm question (PROJECT-TYPES-SPEC section 7.1 step 4).
asks:
  - key: phases.anchor_date
    prompt: "What's the publish date?"
    required: true
  - key: project.end_date
    prompt: "When should promotion wrap up? (leave blank for 30 days after)"
    required: false

# ----------------------------------------------------------------------------
# Defaults this pack suggests (suggestions, never settings; the facility's manifest wins).
# ----------------------------------------------------------------------------
defaults:
  lifecycle: terminal
  preset: countdown-default
