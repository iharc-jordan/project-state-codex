pack:
  id: "work-partnership"
  name: "Partnership or Collaboration"
  version: "0.1.0"
  compatible_core: ">=4.0,<5.0"
  description: |
    Work type for establishing a partnership, alliance or cross-organisation collaboration: agree
    shared goals, sign the agreement, build a joint plan, deliver something together, then review.
    Stage-gate ladder, with the partner relationship itself treated as the thing being built.
  authors:
    - "David Olsson <david@atomic47.co>"
  governing_documents:
    - "docs/PROJECT-TYPES-SPEC.md section 8 — second-wave work types"
    - "templates/phase-presets/stage-gate-default.yaml — the phase ladder this pack assumes"
  released: "2026-09-24"
  maturity: "starter"
  axis: work   # work | accountability | capability - PROJECT-TYPES-SPEC section 3

# ----------------------------------------------------------------------------
# Picker presentation - docs/PROJECT-TYPES-SPEC.md section 5. Every front door (onboarding,
# scaffolder, intake, kanban wizard) reads this block; none keeps its own table of packs.
# ----------------------------------------------------------------------------
picker:
  listed: true
  label: "Partnership or collaboration"
  blurb: "Setting up and running a partnership: shared goals, agreement, joint plan, joint delivery."
  signals:
    - "partnership"
    - "partner"
    - "alliance"
    - "collaboration"
    - "joint venture"
    - "MOU"
    - "memorandum of understanding"
    - "co-marketing"
    - "consortium"
    - "joint"

provides:
  profiles: []
  seeds: [milestones, risks, kpis]
  reporting_matrix_defaults: true

depends_on:
  packs: []

conflicts_with:
  packs: []

# Onboarding asks these after the rhythm question (PROJECT-TYPES-SPEC section 7.1 step 4).
asks:
  - key: project.partner.name
    prompt: "Who is the partner organisation?"
    required: true

# ----------------------------------------------------------------------------
# Defaults this pack suggests (suggestions, never settings; the facility's manifest wins).
# ----------------------------------------------------------------------------
defaults:
  lifecycle: terminal
  preset: stage-gate-default
