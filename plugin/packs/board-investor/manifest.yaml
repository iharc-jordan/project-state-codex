pack:
  id: "board-investor"
  name: "Board / Investor Reporting"
  version: "0.1.0-starter"
  compatible_core: ">=4.0,<5.0"
  description: |
    Pack for PE/VC-backed startup projects. Configures the suite to handle board
    meetings, monthly investor updates, KPI dashboard reporting, board pack
    assembly. Pairs naturally with another funder/customer pack.
  authors:
    - "David Olsson <david@atomic47.co>"
  governing_documents:
    - "Common PE/VC board reporting practice — monthly investor update and board pack shape"
    - "docs/REPORTING-MATRIX.md — the stakeholder/cadence contract this pack seeds"
  released: "2026-04-27"
  maturity: "starter"
  axis: accountability   # work | accountability | capability - PROJECT-TYPES-SPEC section 3

# ----------------------------------------------------------------------------
# Picker presentation - docs/PROJECT-TYPES-SPEC.md section 5. Every front door (onboarding,
# scaffolder, intake, kanban wizard) reads this block; none keeps its own table of packs.
# ----------------------------------------------------------------------------
picker:
  listed: true
  label: "Board or investors"
  blurb: "Monthly investor updates with KPI snapshots, board meetings and board packs."
  signals:
    - "board of directors"
    - "investors"
    - "investor update"
    - "cap table"
    - "board pack"

provides:
  profiles:
    - review-meeting
    - funder-reporting
    - onepager            # audience voice profiles for project-onepager — shipped since the
                          # onepager skill landed but never declared here until 2026-08-21
  # A templates: block declared board-pack.md and monthly-investor-update.md here; neither file
  # ever shipped (there is no templates/ directory) — trimmed 2026-08-21 (FB-014 / issue #17).
  # Re-declare each in the same change that adds the file.
  reporting_matrix_defaults: true

# ----------------------------------------------------------------------------
# Defaults this pack suggests to a facility that loads it
# ----------------------------------------------------------------------------
# lifecycle is a SUGGESTION, not a setting. project-onboarding uses it to pre-fill its
# "does this project end?" question as a confirmation rather than a blank interview, and the
# facility's own manifest.yaml:phases.lifecycle always wins. Nothing is ever written blind, and
# a facility that leaves its lifecycle unset stays permanently valid.
# Resolution order: facility > pack default > terminal.
# Spec: docs/CONTINUOUS-LIFECYCLE-SPEC.md section 4.1
defaults:
  # Board and investor reporting does not close out - it recurs for the life of the company.
  lifecycle: continuous
