PS.views.inputs = {
  tab: 'Inputs', title: 'Inputs', icon: 'inbox', desc: 'Where information comes from, and what is waiting', tools: ['view_inputs', 'get_entity', 'inbox_action'],
  mount(el, { project, watch }) {
    const { h, fmt } = PS
    const wrap = h('div', { class: 'page' }); el.append(wrap)
    let picked = new Set()
    watch(wrap, 'view_inputs', { project }, function render(v) {
      const snap = v.inputs, sources = snap.inputs.filter((i) => i.kind !== 'inbox'), inbox = v.inbox
      const fresh = (s) => s?.freshness === 'fresh' ? PS.chip('fresh', 'good') : s?.freshness === 'stale' ? PS.chip('stale', 'warn') : s?.freshness === 'never' ? PS.chip('never checked', 'warn') : s?.freshness ? PS.chip(fmt.label(s.freshness)) : null
      const bulk = (action) => {
        const files = [...picked]
        if (!files.length) return
        PS.act('inbox_action', { files, action }, { confirm: action === 'delete' ? `Delete ${files.length} file${files.length === 1 ? '' : 's'} from the inbox?` : null, done: action === 'accept' ? `${files.length} moved to working` : `${files.length} deleted` }).then((r) => { if (r) picked = new Set() })
      }
      const canW = PS.canWrite()
      setChildren(wrap,
        PS.head({ section: 'Inputs', title: h('span', {}, `${snap.waiting} `, h('em', {}, 'waiting'), ' for action'), lede: 'Sources feed the project; files dropped or harvested land in the inbox until someone accepts them into working documents.', stats: [[sources.length, 'sources'], [inbox.length, 'in the inbox', inbox.length > 20], [snap.attention, 'need attention', snap.attention > 0], [v.ingested.length, 'accepted recently']] }),
        sources.length ? (() => { const s = PS.section('Sources', h('span', { class: 'sub' }, Object.entries(snap.counts).filter(([k, n]) => n && k !== 'inbox').map(([k, n]) => `${n} ${k}`).join(' · '))); setChildren(s.body, h('ul', { class: 'rows' }, sources.map((i) => h('li', { class: 'row' },
          h('span', { class: 'when' }, PS.chip(i.kind)), h('span', { class: 'what' }, h('div', { class: 'title' }, i.name), h('div', { class: 'sub' }, [i.location, i.status?.detail, i.status?.last_changed ? `changed ${fmt.ago(i.status.last_changed)}` : null].filter(Boolean).join(' · '))), fresh(i.status))))); return s.el })() : null,
        (() => {
          const s = PS.section('Inbox', canW && inbox.length ? h('span', { class: 'acts' }, h('span', { class: 'sub' }, `${picked.size} selected`), PS.actBtn('Accept', () => bulk('accept'), { cls: 'good', title: 'Move the selected files to documents/working' }), PS.actBtn('Delete', () => bulk('delete'), { cls: 'danger' })) : h('span', { class: 'sub' }, `${inbox.length}`))
          setChildren(s.body, inbox.length ? h('ul', { class: 'rows' }, inbox.slice().sort((a, b) => String(b.mtime).localeCompare(String(a.mtime))).map((f) => h('li', { class: 'row clickable', onclick: (e) => { if (e.target.tagName !== 'INPUT') PS.openEntity(`documents/inbox/${f.name}`, f.name) } },
            canW ? h('span', { class: 'when' }, h('input', { type: 'checkbox', 'aria-label': `Select ${f.name}`, checked: picked.has(f.name), onchange: (e) => { e.target.checked ? picked.add(f.name) : picked.delete(f.name); render(v) } })) : h('span', { class: 'when' }, fmt.short(f.mtime)),
            h('span', { class: 'what' }, h('div', { class: 'title' }, f.name.replace(/\.md$/, '')), h('div', { class: 'sub' }, `${fmt.date(f.mtime)} · ${Math.max(1, Math.round((f.size || 0) / 1024))} KB`)), PS.chip(String(f.ext || '').replace('.', '') || 'file')))) : PS.empty('The inbox is empty.'))
          return s.el
        })(),
        v.ingested.length ? (() => { const s = PS.section('Accepted recently'); setChildren(s.body, h('ul', { class: 'rows' }, v.ingested.slice(0, 15).map((d) => h('li', { class: 'row clickable', onclick: () => PS.openEntity(d.path, d.title) }, h('span', { class: 'when' }, fmt.short(d.ingested_at)), h('span', { class: 'what' }, h('div', { class: 'title' }, d.title), h('div', { class: 'sub mono' }, d.path)))))); return s.el })() : null)
    })
  },
}

PS.views.changes = {

PS.views.outputs = {
  tab: 'Outputs', title: 'Outputs', icon: 'doc2', desc: 'Everything the project has produced, by status', tools: ['view_outputs', 'get_entity'],
  mount(el, { project, watch }) {
    const { h, fmt } = PS
    const wrap = h('div', { class: 'page' }); el.append(wrap)
    let filter = 'all'
    const DIR = { draft: 'queue', approved: 'approved', sent: 'sent', dismissed: 'dismissed' }
    watch(wrap, 'view_outputs', { project }, function render(v) {
      const c = v.counts, items = filter === 'all' ? v.items : v.items.filter((i) => i.status === filter)
      const open = (i) => i.origin === 'outbox' && i.artifact ? PS.openEntity(`outbox/${DIR[i.status] || 'queue'}/${i.artifact}`, i.title) : i.downloadPath && i.viewable ? PS.openEntity(`reports/${i.downloadPath}`, i.title) : null
      setChildren(wrap,
        PS.head({ section: 'Outputs', title: h('span', {}, `${c.total} `, h('em', {}, 'outputs')), lede: 'Reports, drafts and job outputs. Drafts wait in the Queue for sign-off; nothing is sent from here.', stats: [[c.draft, 'drafts', c.draft > 5], [c.approved, 'approved'], [c.sent, 'sent'], [c.dismissed, 'dismissed']] }),
        h('div', { class: 'seg' }, [['all', 'All'], ['draft', 'Drafts'], ['approved', 'Approved'], ['sent', 'Sent'], ['dismissed', 'Dismissed']].map(([k, l]) => h('button', { 'aria-pressed': String(filter === k), onclick: () => { filter = k; render(v) } }, l))),
        items.length ? h('div', { class: 'panel' }, h('ul', { class: 'rows' }, items.map((i) => h('li', { class: `row${open ? ' clickable' : ''}`, onclick: () => open(i) },
          h('span', { class: 'when' }, fmt.short(i.produced_at)), h('span', { class: 'what' }, h('div', { class: 'title' }, i.title), h('div', { class: 'sub' }, [i.produced_by, i.surface !== 'none' ? i.surface : null, i.format].filter(Boolean).join(' · '))),
          h('span', { class: 'chips' }, PS.chip(fmt.label(i.docType || i.kind)), PS.statusChip(i.status)))))) : PS.empty('Nothing here.'),
        v.bundles.length ? (() => { const s = PS.section('Report bundles', h('span', { class: 'sub' }, 'generated document sets')); setChildren(s.body, h('ul', { class: 'rows' }, v.bundles.map((b) => h('li', { class: 'row' }, h('span', { class: 'when' }, fmt.short(b.date)), h('span', { class: 'what' }, h('div', { class: 'title' }, b.name), h('div', { class: 'sub' }, b.files.map((f) => f.name).join(' · '))))))); return s.el })() : null)
    })
  },
}

PS.views.processing = {

        v.jobs.length ? h('div', { class: 'panel' }, h('ul', { class: 'rows' }, v.jobs.map((j) => h('li', { class: 'row clickable', onclick: () => PS.openEntity(`outbox/jobs/${j.id}.json`, j.label) },
          h('span', { class: 'when' }, fmt.short(j.started_at)), h('span', { class: 'what' }, h('div', { class: 'title' }, j.label), h('div', { class: 'sub' }, [j.skill, j.actor && fmt.person(j.actor), j.finished_at ? `took ${Math.max(1, Math.round((Date.parse(j.finished_at) - Date.parse(j.started_at)) / 60000))} min` : null, j.error].filter(Boolean).join(' · '))),

PS.views.automation = {
  tab: 'Automation', title: 'Automation', icon: 'clock', desc: 'What runs on a schedule, and when', tools: ['view_automation'],
  mount(el, { project, watch }) {
    const { h, fmt } = PS
    const wrap = h('div', { class: 'page' }); el.append(wrap)
    const cad = (c) => { if (!c) return '—'; const k = c.kind; return k === 'weekly' ? `weekly, ${c.day}` : k === 'monthly' ? `monthly${c.day ? ', day ' + c.day : ''}` : k === 'once' ? `once, ${fmt.date(c.start)}${c.hour != null ? ` ${String(c.hour).padStart(2, '0')}:00` : ''}` : k === 'daily' ? 'daily' : fmt.label(k) }
    watch(wrap, 'view_automation', { project }, (v) => {
      const byId = new Map(v.matrix.map((m) => [m.id, m]))
      const on = v.tasks.filter((t) => t.enabled !== false && t.status !== 'proposed'), proposed = v.tasks.filter((t) => t.status === 'proposed')
      const row = (t) => { const m = t.target?.kind === 'matrix' ? byId.get(t.target.ref) : null; return h('li', { class: 'row' },
        h('span', { class: 'when' }, PS.chip(t.target?.kind || 'task')), h('span', { class: 'what' }, h('div', { class: 'title' }, t.title || m?.report || t.target?.ref || t.id), h('div', { class: 'sub' }, [cad(t.cadence || m?.cadence), m?.generator, m?.surface].filter(Boolean).join(' · '))),
        t.status === 'proposed' ? PS.chip('proposed', 'warn') : t.enabled === false ? PS.chip('off') : PS.chip('on', 'good')) }
      setChildren(wrap,
        PS.head({ section: 'Automation', title: h('span', {}, `${on.length} `, h('em', {}, 'scheduled'), ` · ${proposed.length} proposed`), lede: 'Tasks the scheduler runs, compiled from the reporting matrix plus holds proposed by the orchestrator. A project on a computer is run there; a cloud project is run by the cloud scheduler (Admin → Runs).', stats: [[v.matrix.length, 'matrix entries']] }),
        (() => { const s = PS.section('Scheduled'); setChildren(s.body, on.length ? h('ul', { class: 'rows' }, on.map(row)) : PS.empty('Nothing scheduled.')); return s.el })(),
        proposed.length ? (() => { const s = PS.section('Proposed', h('span', { class: 'sub' }, 'waiting for someone to accept')); setChildren(s.body, h('ul', { class: 'rows' }, proposed.map(row))); return s.el })() : null)
    })
  },
}

PS.views.admin = {
  tab: 'Admin', title: 'Admin', icon: 'shield', desc: 'People by email, their role and project access', tools: ['whoami', 'admin_overview', 'admin_member', 'admin_access', 'admin_audit', 'project_transfer'],
  mount(el, { watch }) {
    const { h, fmt } = PS
    const wrap = h('div', { class: 'page' }); el.append(wrap)
    let org = PS.store.get('ps.admin.org'), tab = PS.store.get('ps.admin.tab') || 'people'
    const act = (tool, args, done, confirm) => PS.act(tool, args, { done, confirm })
    watch(wrap, 'admin_overview', {}, (list) => {
      const orgs = list.orgs || []
      if (!orgs.length) { setChildren(wrap, PS.head({ section: 'Admin', title: 'Nothing to administer' }), PS.empty('You are not an admin of any org.')); return }
      if (!orgs.some((o) => o.org === org)) org = (orgs.find((o) => o.org === String(PS.project || '').split('/')[0]) || orgs[0]).org
      const body = h('div', {})
      const pick = h('select', { class: 'inline-sel', 'aria-label': 'Org', onchange: (e) => { org = e.target.value; PS.store.set('ps.admin.org', org); PS.reload() } }, orgs.map((o) => h('option', { value: o.org, selected: o.org === org }, o.name || o.org)))
      setChildren(wrap, body)
      watch(body, 'admin_overview', { org }, (d) => {
        const o = d.org || {}
        const seats = o.seat_cap != null ? `${o.seats_used} / ${o.seat_cap}` : o.seats_used
        const tabs = h('div', { class: 'seg' }, [['people', 'People'], ['access', 'Project access'], ['projects', 'Projects'], ['audit', 'Audit log']].map(([k, l]) => h('button', { 'aria-pressed': String(tab === k), onclick: () => { tab = k; PS.store.set('ps.admin.tab', k); PS.reload() } }, l)))
        const content = h('div', {})
        setChildren(body,
          PS.head({ section: h('span', {}, 'Admin · ', pick), title: h('span', {}, o.name || org, ' ', h('em', {}, 'people & access')), lede: 'People are added by email. Joining gives no projects: give each person viewer or editor on the projects they need. Admins edit every project in the org; guests only view and use no seat. Every change is audited.', stats: [[o.counts?.members ?? 0, 'active'], [o.counts?.admins ?? 0, 'admins'], [o.counts?.guests ?? 0, 'guests'], [seats, 'seats used'], o.plan ? [o.plan, 'plan'] : null] }),
          list.superadmin ? h('div', { class: 'callout', style: 'font-size:12.5px' }, 'You are a superadmin: you manage every org, but see a project\'s data only where you are allocated. Orgs are created in the web admin at ', h('span', { class: 'mono' }, 'cloud.project-state.app/admin'), '.') : null,
          tabs, content)
        if (tab === 'people') setChildren(content, people(d))
        else if (tab === 'access') setChildren(content, access(d))
        else if (tab === 'projects') setChildren(content, projects(d))
        else { setChildren(content, h('div', { class: 'loading' }, 'Loading')); watch(content, 'admin_audit', { org, limit: 150 }, (a) => setChildren(content, audit(a.entries || []))) }
      })
    })

    function people(d) {
      const invite = async () => {
        const v = await PS.dialog({ title: `Add someone to ${org}`, intro: 'They sign in with this email. Adding them gives no projects yet.', fields: [{ name: 'email', label: 'Email', type: 'email', required: true, placeholder: 'name@company.com' }, { name: 'role', label: 'Role', type: 'select', value: 'member', options: [['member', 'Member'], ['admin', 'Admin (every project)'], ['guest', 'Guest (view only, free)']] }], submit: 'Add person' })
        if (v) act('admin_member', { org, email: v.email, action: 'invite', role: v.role }, `${v.email} added`)
      }
      const s = PS.section('People', h('span', { class: 'acts' }, h('span', { class: 'sub' }, `${d.members.length}`), PS.actBtn('Add person', invite, { icon: 'plus' })))
      setChildren(s.body, d.members.length ? h('ul', { class: 'rows' }, d.members.map((m) => h('li', { class: 'row', style: m.status !== 'active' ? 'opacity:.6' : '' },
        h('span', { class: 'when' }, h('select', { class: 'inline-sel', 'aria-label': `Role of ${m.email}`, onchange: (e) => act('admin_member', { org, email: m.email, action: 'role', role: e.target.value }, `${m.email} is now ${e.target.value}`) }, ['admin', 'member', 'guest'].map((r) => h('option', { value: r, selected: r === m.role }, r)))),
        h('span', { class: 'what' }, h('div', { class: 'title' }, m.email), h('div', { class: 'sub' }, m.projects === 'all (admin)' ? 'every project (admin)' : m.projects.length ? m.projects.map((p) => `${p.project} · ${p.access}`).join(', ') : 'no projects yet')),
        h('span', { class: 'acts' }, m.status === 'active' ? PS.chip('active', 'good') : PS.chip('disabled', 'crit'),
          m.status === 'active' ? PS.actBtn('Disable', () => act('admin_member', { org, email: m.email, action: 'disable' }, `${m.email} disabled`, `Disable ${m.email}? They lose access everywhere in ${org} at their next click or tool call.`), { cls: 'ghost' })
            : PS.actBtn('Enable', () => act('admin_member', { org, email: m.email, action: 'enable' }, `${m.email} enabled`), { cls: 'ghost' }),
          PS.actBtn('Remove', () => act('admin_member', { org, email: m.email, action: 'remove' }, `${m.email} removed`, `Remove ${m.email} from ${org}? Their project access goes too.`), { cls: 'danger' }))))) : PS.empty('Nobody yet.'))
      return s.el
    }

    // Links from project_transfer work once, for 10 minutes; exports and moves are audited.
    async function getLink(project, action, mode) {
      try {
        const r = (await PS.mcp.callTool(PS.SERVER, 'project_transfer', { project, action, ...(mode ? { mode } : {}) })).payload
        if (!r?.url) throw new Error(r?.error || 'no link returned')
        return r
      } catch (err) { PS.toast(err?.message || String(err), 'err'); return null }
    }
    const linkDialog = (title, r) => PS.guide(title, r)
    function projects(d) {
      const rows = d.projects.map((p) => {
        const ref = `${org}/${p.project}`
        const home = p.home === 'server' ? PS.chip('cloud', 'accent') : p.home === 'local' ? PS.chip('checked out', 'warn') : p.home === 'mirror' ? PS.chip('mirror') : PS.chip(p.home, 'crit')
        return h('li', { class: 'row' }, h('span', { class: 'when' }, home), h('span', { class: 'what' }, h('div', { class: 'title' }, p.project), h('div', { class: 'sub' }, p.state || '')),
          h('span', { class: 'acts' },
            PS.actBtn('Download a copy', async () => { const r = await getLink(ref, 'download'); if (r) linkDialog(`Download a copy of ${ref}`, r) }, { cls: 'ghost', title: 'A zip of the whole project; moves nothing; audited' }),
            p.home === 'server' ? PS.actBtn('Download to disk', async () => { const r = await getLink(ref, 'checkout'); if (r) linkDialog(`Download ${ref} to disk`, r) }, { cls: 'ghost' }) : null,
            p.home === 'local' || p.home === 'broken' ? PS.actBtn('Return to cloud', () => PS.act('project_transfer', { project: ref, action: 'release' }, { confirm: `Make ${ref} writable in the cloud again? Only if the disk copy was abandoned.`, done: 'Writable in the cloud again' }), { cls: 'danger' }) : null))
      })
      const bring = async () => {
        const v = await PS.dialog({ title: 'Bring a project into the cloud', intro: 'Name the project as it will appear in the cloud, and choose what should happen. Next you get step-by-step instructions (browser, Codex or terminal). Nothing happens until someone uploads the folder.', fields: [{ name: 'name', label: 'Project name in the cloud', placeholder: 'lowercase, e.g. ai26-10', required: true, hint: 'Lowercase letters, digits and dashes.' }, { name: 'mode', label: 'What should happen', type: 'select', value: 'move', options: [['move', 'Move to cloud: the team works on it in Codex; the computer copy becomes read-only'], ['publish', 'Publish a read-only copy: it stays on the computer; the team can only view it']] }], submit: 'Show me how' })
        if (!v) return
        const r = await getLink(`${org}/${v.name.trim()}`, 'upload', v.mode)
        if (r) linkDialog(`${v.mode === 'move' ? 'Move' : 'Publish'} ${org}/${v.name.trim()}`, r)
      }
      const s = PS.section('Projects', h('span', { class: 'acts' }, h('span', { class: 'sub' }, 'cloud · mirror · checked out'), PS.actBtn('Bring a project in', bring, { icon: 'plus' })))
      setChildren(s.body, rows.length ? h('ul', { class: 'rows' }, rows) : PS.empty('No projects yet.'))
      return s.el
    }

    function access(d) {
      const people = d.members.filter((m) => m.status === 'active')
      if (!d.projects.length) return PS.empty(`${org} has no projects yet.`)
      return h('div', { class: 'panel', style: 'overflow-x:auto' }, h('table', { class: 't' },
        h('thead', {}, h('tr', {}, h('th', {}, 'Person'), d.projects.map((p) => h('th', {}, p.project, h('div', {}, PS.chip(p.home === 'server' ? 'cloud' : p.home === 'local' ? 'checked out' : 'mirror', p.home === 'server' ? 'accent' : p.home === 'local' ? 'warn' : '')))))),
        h('tbody', {}, people.map((m) => h('tr', {}, h('td', {}, h('div', {}, m.email), h('div', { class: 'faint' }, m.role)), d.projects.map((p) => {
          if (m.role === 'admin') return h('td', {}, PS.chip('editor · admin', 'good'))
          const cur = p.access.find((a) => a.email === m.email)?.access || 'none'
          return h('td', {}, h('select', { class: 'inline-sel', 'aria-label': `${m.email} on ${p.project}`, onchange: (e) => act('admin_access', { project: `${org}/${p.project}`, email: m.email, access: e.target.value }, `${m.email}: ${e.target.value} on ${p.project}`) },
            (m.role === 'guest' ? ['none', 'viewer'] : ['none', 'viewer', 'editor']).map((x) => h('option', { value: x, selected: x === cur }, x))))
        }))))))
    }

    function audit(entries) {
      return entries.length ? h('div', { class: 'panel' }, h('ul', { class: 'rows' }, entries.map((e) => h('li', { class: 'row', style: 'grid-template-columns:130px 1fr auto' },
        h('span', { class: 'mono faint' }, fmt.stamp(e.ts)), h('span', { class: 'what' }, h('div', { class: 'title' }, `${fmt.label(e.action)}${e.target ? ' · ' + e.target : ''}${e.project ? ' on ' + e.project : ''}`), h('div', { class: 'sub' }, [e.actor, e.detail?.label, e.detail?.access && `access ${e.detail.access}`, e.detail?.role && `role ${e.detail.role}`].filter(Boolean).join(' · '))),
        PS.chip(String(e.action).split('.')[0]))))) : PS.empty('Nothing recorded yet.')
    }
  },
}

// Runs — the cloud scheduler for an org (M49; services/state-mcp/src/tools-scheduler.mjs, scheduler_admin). What ran for
// each cloud project, what is queued, and the controls: run now, cancel, pause, resume, and which phases the org runs.
// Org admins and superadmins; every control is audited server-side.
PS.views.runs = {
  tab: 'Runs', title: 'Runs', icon: 'clock', desc: 'The cloud scheduler: what ran, what is queued, and its controls', tools: ['admin_overview', 'scheduler_admin', 'admin_token'],
  mount(el, { watch }) {
    const { h, fmt } = PS
    const wrap = h('div', { class: 'page' }); el.append(wrap)
    let org = PS.store.get('ps.runs.org') || PS.store.get('ps.admin.org')
    const PHASES = [['harvest', 'Harvest'], ['tick', 'Tick'], ['digest', 'Digest']]
    const COST = { harvest: 'model time', tick: 'about $0.50', digest: 'about $0.60' }
    const cls = (s) => ({ ok: 'good', quiet: '', failed: 'crit', running: 'accent', cancelled: 'warn', skipped: '', pending: 'accent', taken: 'accent', done: 'good', refused: 'warn' })[s] ?? ''
    const jobLabel = (j) => j.startsWith('phase:') ? j.slice(6).replace(/^./, (c) => c.toUpperCase()) : j === 'matrix:portfolio-weekly-collect' ? 'Weekly collect' : fmt.label(j.replace(/^matrix:/, ''))
    const act = (args, done, confirm) => PS.act('scheduler_admin', { org, ...args }, { done, confirm })

    watch(wrap, 'admin_overview', {}, (list) => {
      const orgs = list.orgs || []
      if (!orgs.length) { setChildren(wrap, PS.head({ section: 'Admin', title: 'Nothing to run' }), PS.empty('You are not an admin of any org.')); return }
      if (!orgs.some((o) => o.org === org)) org = (orgs.find((o) => o.org === String(PS.project || '').split('/')[0]) || orgs[0]).org
      const pick = h('select', { class: 'inline-sel', 'aria-label': 'Org', onchange: (e) => { org = e.target.value; PS.store.set('ps.runs.org', org); PS.reload() } }, orgs.map((o) => h('option', { value: o.org, selected: o.org === org }, o.name || o.org)))
      const body = h('div', {}); setChildren(wrap, body)
      watch(body, 'scheduler_admin', { action: 'status', org }, (d) => setChildren(body, ...page(d, pick, orgs.find((o) => o.org === org))))
    })

    function page(d, pick, o) {
      const hb = d.heartbeat, b = hb?.budget || {}
      const stale = !hb || Date.now() - Date.parse(hb.at) > 15 * 60_000
      const cap = b.daily_usd ?? null
      return [
        PS.head({ section: h('span', {}, 'Admin · ', pick), title: h('span', {}, o?.name || org, ' ', h('em', {}, 'cloud scheduler')),
          lede: 'Automation for projects whose home is the cloud. The scheduler checks every two minutes; each job runs once per period and retries a failure up to three times. Harvest, tick and digest are model runs and cost money; a portfolio\'s weekly collect does not.',
          stats: [[d.today.runs, 'runs today'], [d.today.failed, 'failed', d.today.failed > 0], [d.today.running, 'running now'], [`$${(b.spent_usd >= 0 ? b.spent_usd : d.today.cost_usd).toFixed(2)}`, cap != null ? `spent of $${cap}` : 'spent today'], [hb ? fmt.ago(hb.at) : 'never', 'last check-in', stale]] }),
        stale ? h('div', { class: 'callout warn', style: 'font-size:12.5px' }, hb ? `The scheduler has not checked in since ${fmt.stamp(hb.at)}. Nothing runs until it does; see deploy/cloud/README.md.` : 'The scheduler has never checked in for this org: it has no service token for it yet.') : null,
        phases(d, hb), projects(d), queue(d), recent(d), tokens(d),
      ].filter(Boolean)
    }

    function phases(d, hb) {
      const on = new Set(d.phases ?? []), times = hb?.times || {}
      const set = (k) => {
        const next = on.has(k) ? [...on].filter((x) => x !== k) : [...on, k]
        act({ action: 'set_phases', phases: next }, `${fmt.label(k)} ${on.has(k) ? 'off' : 'on'} for ${org}`, on.has(k) ? null : `Turn ${k} on for every cloud project in ${org}? It runs daily at ${times[k] || 'its time'} and uses model time (${COST[k]} a project).`)
      }
      const s = PS.section('Phases', h('span', { class: 'sub' }, d.phases == null ? 'the host\'s default — change one to set them here' : `set by ${d.phases_by} ${fmt.ago(d.phases_at)}`))
      setChildren(s.body, h('ul', { class: 'rows' }, PHASES.map(([k, l]) => h('li', { class: 'row' },
        h('span', { class: 'when' }, on.has(k) ? PS.chip('on', 'good') : PS.chip('off')),
        h('span', { class: 'what' }, h('div', { class: 'title' }, l), h('div', { class: 'sub' }, [`daily at ${times[k] || '—'} ${hb?.tz || ''}`, k === 'harvest' ? 'needs connectors on the server (not yet available)' : COST[k] + ' a project'].join(' · '))),
        h('span', { class: 'acts' }, PS.actBtn(on.has(k) ? 'Turn off' : 'Turn on', () => set(k), { cls: on.has(k) ? 'ghost' : '' }))))))
      return s.el
    }

    function projects(d) {
      const cloud = d.projects.filter((p) => p.home === 'server'), other = d.projects.filter((p) => p.home !== 'server')
      const matrixJobs = [...new Set(cloud.flatMap((p) => p.jobs.map((j) => j.job)).filter((j) => j.startsWith('matrix:')))]
      const cols = [...PHASES.map(([k]) => `phase:${k}`), ...matrixJobs]
      const cell = (p, job) => {
        const r = p.jobs.find((j) => j.job === job), paused = p.paused.find((x) => x.job === job)
        const run = () => act({ action: 'run_now', project: p.project, job }, `${jobLabel(job)} queued for ${p.project}`, job.startsWith('phase:') ? `Run ${jobLabel(job).toLowerCase()} for ${p.project} now? It starts within two minutes and uses model time.` : `Run ${jobLabel(job).toLowerCase()} for ${p.project} now?`)
        const pause = () => act({ action: paused ? 'resume' : 'pause', project: p.project, job }, `${jobLabel(job)} ${paused ? 'resumed' : 'paused'} for ${p.project}`)
        return h('td', {},
          h('div', {}, r ? PS.chip(r.status === 'failed' ? `failed #${r.attempt}` : r.status, cls(r.status)) : h('span', { class: 'faint' }, 'not run'), paused ? PS.chip('paused', 'warn') : null),
          r ? h('div', { class: 'faint', style: 'font-size:11px', title: r.summary || '' }, [fmt.ago(r.finished_at || r.ts), r.duration_s != null ? `${Math.round(r.duration_s)}s` : null, r.cost_usd ? `$${r.cost_usd.toFixed(2)}` : null].filter(Boolean).join(' · ')) : null,
          h('div', { class: 'acts', style: 'margin-top:4px' }, PS.actBtn('Run now', run, { cls: 'ghost', icon: 'bolt' }), PS.actBtn(paused ? 'Resume' : 'Pause', pause, { cls: 'ghost' })))
      }
      const s = PS.section('Cloud projects', h('span', { class: 'sub' }, `${cloud.length}`))
      setChildren(s.body, cloud.length ? h('div', { style: 'overflow-x:auto' }, h('table', { class: 't' },
        h('thead', {}, h('tr', {}, h('th', {}, 'Project'), cols.map((c) => h('th', {}, jobLabel(c))))),
        h('tbody', {}, cloud.map((p) => h('tr', {}, h('td', {}, h('div', { class: 'title' }, p.project)), cols.map((c) => cell(p, c))))))) : PS.empty(`${org} has no projects whose home is the cloud yet. Mirrors and checked-out projects are run where they live.`),
        ...(other.length ? [h('div', { class: 'faint', style: 'font-size:12px; padding:8px 18px' }, `Run where they live, not here: ${other.map((p) => `${p.project} (${p.home === 'mirror' ? 'mirror' : p.state})`).join(', ')}.`)] : []))
      return s.el
    }

    function queue(d) {
      const waiting = d.queue.filter((q) => q.status === 'pending' || q.status === 'taken'), running = d.recent.filter((r) => r.status === 'running')
      const s = PS.section('Queue', h('span', { class: 'sub' }, `${waiting.length} requested · ${running.length} running`))
      const rows = [
        ...waiting.map((q) => h('li', { class: 'row' }, h('span', { class: 'when' }, PS.chip(q.status === 'pending' ? 'waiting' : 'running', 'accent')),
          h('span', { class: 'what' }, h('div', { class: 'title' }, `${jobLabel(q.job)} · ${q.project}`), h('div', { class: 'sub' }, `run now by ${q.by} ${fmt.ago(q.at)}`)),
          h('span', { class: 'acts' }, PS.actBtn(q.status === 'pending' ? 'Cancel' : 'Stop', () => act({ action: 'cancel', id: q.id }, q.status === 'pending' ? 'Request cancelled' : 'Stopping the run', q.status === 'pending' ? null : `Stop ${jobLabel(q.job).toLowerCase()} for ${q.project}? The worker is stopped within about 15 seconds.`), { cls: 'danger' })))),
        ...running.filter((r) => !waiting.some((q) => q.run_id === r.id)).map((r) => h('li', { class: 'row' }, h('span', { class: 'when' }, PS.chip('running', 'accent')),
          h('span', { class: 'what' }, h('div', { class: 'title' }, `${jobLabel(r.job)} · ${r.project}`), h('div', { class: 'sub' }, `attempt ${r.attempt} · started ${fmt.ago(r.ts)}${r.cancel_requested_at ? ` · stopping (${r.cancel_requested_by})` : ''}`)),
          h('span', { class: 'acts' }, r.phase === 'collect' ? h('span', { class: 'faint' }, 'finishes on its own') : r.cancel_requested_at ? null : PS.actBtn('Stop', () => act({ action: 'cancel', id: r.id }, 'Stopping the run', `Stop ${jobLabel(r.job).toLowerCase()} for ${r.project}? It is not retried this period unless someone runs it again.`), { cls: 'danger' })))),
      ]
      const done = d.queue.filter((q) => ['refused', 'cancelled'].includes(q.status)).slice(0, 5)
      setChildren(s.body, rows.length ? h('ul', { class: 'rows' }, rows) : PS.empty('Nothing queued or running.'),
        ...(done.length ? [h('div', { class: 'faint', style: 'font-size:12px; padding:6px 18px 10px' }, done.map((q) => `${jobLabel(q.job)} · ${q.project}: ${q.status}${q.reason ? ` — ${q.reason}` : ''}`).join(' · '))] : []))
      return s.el
    }

    function recent(d) {
      const s = PS.section('Recent runs', h('span', { class: 'sub' }, `${d.recent.length}`))
      setChildren(s.body, d.recent.length ? h('ul', { class: 'rows' }, d.recent.slice(0, 30).map((r) => h('li', { class: 'row clickable', onclick: () => detail(r) },
        h('span', { class: 'when' }, fmt.short(r.ts)),
        h('span', { class: 'what' }, h('div', { class: 'title' }, `${jobLabel(r.job)} · ${r.project}`), h('div', { class: 'sub' }, String(r.summary || '').slice(0, 160))),
        h('span', { class: 'acts' }, r.request_id ? PS.chip('run now') : null, PS.chip(r.status === 'failed' ? `failed #${r.attempt}` : r.status, cls(r.status)))))) : PS.empty('Nothing has run yet.'))
      return s.el
    }

    function tokens(d) {
      const s = PS.section('Service tokens', h('span', { class: 'sub' }, 'the identities the scheduler runs as; minted by a superadmin'))
      setChildren(s.body, d.tokens.length ? h('ul', { class: 'rows' }, d.tokens.map((t) => h('li', { class: 'row' }, h('span', { class: 'when' }, PS.chip(t.state, t.state === 'active' ? 'good' : 'warn')),
        h('span', { class: 'what' }, h('div', { class: 'title' }, `${t.label} · ${t.access} on ${t.projects.join(', ')}`), h('div', { class: 'sub mono' }, `${t.id} · last used ${t.last_used_at ? fmt.ago(t.last_used_at) : 'never'} · until ${String(t.expires_at).slice(0, 10)}`)),
        h('span', { class: 'acts' }, t.state === 'active' ? PS.actBtn('Revoke', () => PS.act('admin_token', { action: 'revoke', id: t.id }, { done: `${t.id} revoked`, confirm: `Revoke ${t.label} (${t.id})? The scheduler stops for ${org} at its next call until a superadmin mints a new one.` }), { cls: 'danger' }) : null)))) : PS.empty(`No tokens: the scheduler cannot run ${org}'s projects until a superadmin mints one.`))
      return s.el
    }

    function detail(r) {
      const close = () => { back.remove(); dr.remove(); document.removeEventListener('keydown', onKey) }
      const onKey = (e) => { if (e.key === 'Escape') close() }
      const back = h('div', { class: 'drawer-back', onclick: close })
      const kv = [['Status', r.status], ['Project', r.project], ['Job', jobLabel(r.job)], ['Period', fmt.stamp(r.period)], ['Attempt', r.attempt], ['Started', fmt.stamp(r.ts)], ['Finished', r.finished_at ? fmt.stamp(r.finished_at) : null], ['Duration', r.duration_s != null ? `${Math.round(r.duration_s)} s` : null], ['Cost', r.cost_usd ? `$${r.cost_usd.toFixed(2)}` : null], ['Tokens', r.tokens || null], ['Claimed by', r.actor], ['Run now by', r.requested_by], ['Cancelled by', r.cancelled_by || r.cancel_requested_by]].filter(([, v]) => v != null && v !== '')
      const dr = h('aside', { class: 'drawer', role: 'dialog', 'aria-label': 'Run' }, h('div', { class: 'drawer-head' }, h('h2', {}, `${jobLabel(r.job)} · ${r.project}`), h('button', { class: 'close', onclick: close }, 'Close')),
        h('div', { class: 'drawer-body' }, h('div', { class: 'mono muted' }, r.id),
          h('dl', { class: 'kv' }, kv.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, String(v))])),
          r.summary ? h('div', { class: 'prose' }, h('p', {}, r.summary)) : null,
          r.lines?.length ? h('ul', { class: 'rows' }, r.lines.map((l) => h('li', { class: 'row', style: 'grid-template-columns:1fr' }, h('span', {}, l)))) : null,
          h('div', { class: 'chips', style: 'margin-top:12px' }, r.status !== 'running' ? PS.actBtn('Run again now', () => { close(); act({ action: 'run_now', project: r.project, job: r.job }, `${jobLabel(r.job)} queued for ${r.project}`, r.phase === 'collect' ? null : 'Run it again now? It uses model time.') }, { icon: 'bolt' }) : null)))
      document.body.append(back, dr); document.addEventListener('keydown', onKey); dr.querySelector('.close').focus()
    }
  },
}

PS.boot({ viewIds: ["today","dashboard","board","capabilities","calendar","goals","milestones","inputs","decisions","risks","changes","lessons","documents","team","feedback","matrix","outputs","tech","queue","gaps","processing","automation","costing","substrate","activity","scoreboard","wiki","admin","runs","cap-sred","cap-intel","cap-tender","cap-portfolio","cap-research"], single: false, title: "Project State Console" })
</script>
