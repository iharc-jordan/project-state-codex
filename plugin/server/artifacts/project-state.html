<!doctype html>
<meta charset="utf-8">
<title>Project State Console</title>
<meta name="description" content="A read-only Project State snapshot with project views, milestones, goals, reporting, and configured capability summaries.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* project-state-app design tokens, ported from project-state/kanban/src/app/globals.css.
   The app selects themes with <html data-theme>; artifact viewers stamp data-theme="light|dark" on the
   same root, so here the app theme lives on data-ps-theme. The light theme comes from the project's
   branding.yaml (default: Terracotta); a dark viewer gets Midnight. A branding accent overrides the terra
   family exactly as the app does (color-mix toward black/white). */

:root {
  color-scheme: light;
  --accent: #0ea5e9; --accent-dark: #0284c7; --accent-bg: #f0f9ff;
  --paper: #efe9df; --paper-side: #e9e2d6; --paper-bar: #e4ddd2;
  --raised: #fbf9f5; --raised-2: #f5f2ec; --stone-chip: #f1ede6;
  --ink: #252c37; --ink-2: #4a4540; --mid: #78716c; --mid-2: #a8a096;
  --rule: #dcd4c7; --rule-soft: #e6dfd3;
  --terra: #b4530a; --terra-deep: #92400e; --terra-soft: #e8c9a8; --terra-wash: #f3e4d2;
  --green: #2da957; --green-wash: #ecfaf0; --green-line: #bfe6cc;
  --amber: #c8861a; --amber-deep: #a36012; --amber-wash: #fef9ec;
  --rose: #c0563b; --rose-deep: #9c3d27; --rose-soft: #f5c8bc; --rose-wash: #fdf3f0;
  --ps-serif: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --ps-body: Calibri, "Carlito", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ps-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --pop-shadow: 0 12px 30px -10px rgba(60, 45, 30, 0.22);
  --card-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --hot-shadow: 0 4px 14px rgba(180, 83, 10, 0.1);
  --topnav-h: 48px;
}
:root[data-ps-theme="slate"] { --accent:#2563eb;--accent-dark:#1d4ed8;--accent-bg:#e8f0fe;--paper:#eef1f5;--paper-side:#e6eaf0;--paper-bar:#e2e7ee;--raised:#fff;--raised-2:#f4f6f9;--stone-chip:#edf0f4;--ink:#1e293b;--ink-2:#334155;--mid:#64748b;--mid-2:#94a3b8;--rule:#d5dce5;--rule-soft:#e6eaf0;--terra:#2563eb;--terra-deep:#1d4ed8;--terra-soft:#bbd0fb;--terra-wash:#e8f0fe; }
:root[data-ps-theme="forest"] { --accent:#2f855a;--accent-dark:#276749;--accent-bg:#e6f4ec;--paper:#ecf0ea;--paper-side:#e4eae0;--paper-bar:#dfe6da;--raised:#fbfcfa;--raised-2:#f1f5ef;--stone-chip:#eaefe7;--ink:#1c2b22;--ink-2:#2e4034;--mid:#5b6b60;--mid-2:#94a89a;--rule:#d2dbcc;--rule-soft:#e1e8db;--terra:#2f855a;--terra-deep:#276749;--terra-soft:#bbe3cc;--terra-wash:#e6f4ec; }
:root[data-ps-theme="plum"] { --accent:#7c3aed;--accent-dark:#6d28d9;--accent-bg:#efe8fb;--paper:#f0edf4;--paper-side:#e9e4ef;--paper-bar:#e4deec;--raised:#fcfbfe;--raised-2:#f4f1f8;--stone-chip:#eeeaf3;--ink:#2a2235;--ink-2:#3f3550;--mid:#6b6280;--mid-2:#a096b0;--rule:#dad2e4;--rule-soft:#e6e0ee;--terra:#7c3aed;--terra-deep:#6d28d9;--terra-soft:#d6c4f5;--terra-wash:#efe8fb; }
:root[data-ps-theme="mono"] { --accent:#18181b;--accent-dark:#000;--accent-bg:#eaeae8;--paper:#f4f4f2;--paper-side:#ececea;--paper-bar:#e8e8e6;--raised:#fff;--raised-2:#f3f3f1;--stone-chip:#ededeb;--ink:#18181b;--ink-2:#303034;--mid:#6b6b70;--mid-2:#a1a1a6;--rule:#dcdcda;--rule-soft:#e8e8e6;--terra:#18181b;--terra-deep:#000;--terra-soft:#c8c8ca;--terra-wash:#eaeae8; }
:root[data-ps-theme="happy"] { --accent:#f0386b;--accent-dark:#d11e54;--accent-bg:#ffe5ee;--paper:#fff7ec;--paper-side:#ffefdc;--paper-bar:#ffe8cf;--raised:#fff;--raised-2:#fff6e9;--stone-chip:#ffefd6;--ink:#3a2a36;--ink-2:#5e4a58;--mid:#8c7886;--mid-2:#c2aeba;--rule:#f4dabf;--rule-soft:#fbe9d6;--terra:#f0386b;--terra-deep:#d11e54;--terra-soft:#fbc2d4;--terra-wash:#ffe5ee;--green:#15b79e;--green-wash:#e6faf5;--green-line:#b6ece1;--amber:#ff9f1c;--amber-deep:#d97706;--amber-wash:#fffbeb;--rose:#e8543d;--rose-deep:#c0392b;--rose-soft:#fecaca;--rose-wash:#fff5f5; }
:root[data-ps-theme="workaday"] { --accent:#5b7083;--accent-dark:#43525e;--accent-bg:#e8ecef;--paper:#eef0f1;--paper-side:#e6e8ea;--paper-bar:#e1e4e6;--raised:#fafbfc;--raised-2:#f1f3f4;--stone-chip:#ebedef;--ink:#283038;--ink-2:#3e464f;--mid:#69727b;--mid-2:#98a1aa;--rule:#d5d9dd;--rule-soft:#e4e7ea;--terra:#5b7083;--terra-deep:#43525e;--terra-soft:#c4ced6;--terra-wash:#e8ecef;--green:#4f9d69;--green-wash:#ecf5ef;--green-line:#c8e2d1;--amber:#b8893c;--rose:#b0584a; }

/* Midnight: the project's own choice, or any viewer in dark mode (system or explicit). */
:root[data-ps-theme="midnight"] { color-scheme: dark; --accent:#e2703a;--accent-dark:#f2a06a;--accent-bg:#2a2018;--paper:#14161b;--paper-side:#181b22;--paper-bar:#1b1f27;--raised:#20242d;--raised-2:#262b35;--stone-chip:#2a2f3a;--ink:#eceff4;--ink-2:#c7cdd8;--mid:#9aa3b2;--mid-2:#6b7384;--rule:#333a47;--rule-soft:#2a303b;--terra:#e2703a;--terra-deep:#f2a06a;--terra-soft:#5a3a28;--terra-wash:#2a2018;--green:#34d399;--green-wash:#14271e;--green-line:#1e4d38;--amber:#e0a93b;--amber-deep:#f0c060;--amber-wash:#2a2310;--rose:#e07a5f;--rose-deep:#f09070;--rose-soft:#5a3020;--rose-wash:#2a1a14;--pop-shadow:0 12px 30px -10px rgba(0,0,0,.6);--hot-shadow:0 4px 14px rgba(0,0,0,.4); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-ps-pinned]) { color-scheme: dark; --accent:#e2703a;--accent-dark:#f2a06a;--accent-bg:#2a2018;--paper:#14161b;--paper-side:#181b22;--paper-bar:#1b1f27;--raised:#20242d;--raised-2:#262b35;--stone-chip:#2a2f3a;--ink:#eceff4;--ink-2:#c7cdd8;--mid:#9aa3b2;--mid-2:#6b7384;--rule:#333a47;--rule-soft:#2a303b;--terra:#e2703a;--terra-deep:#f2a06a;--terra-soft:#5a3a28;--terra-wash:#2a2018;--green:#34d399;--green-wash:#14271e;--green-line:#1e4d38;--amber:#e0a93b;--amber-deep:#f0c060;--amber-wash:#2a2310;--rose:#e07a5f;--rose-deep:#f09070;--rose-soft:#5a3020;--rose-wash:#2a1a14;--pop-shadow:0 12px 30px -10px rgba(0,0,0,.6);--hot-shadow:0 4px 14px rgba(0,0,0,.4); }
}
:root[data-theme="dark"]:not([data-ps-pinned]) { color-scheme: dark; --accent:#e2703a;--accent-dark:#f2a06a;--accent-bg:#2a2018;--paper:#14161b;--paper-side:#181b22;--paper-bar:#1b1f27;--raised:#20242d;--raised-2:#262b35;--stone-chip:#2a2f3a;--ink:#eceff4;--ink-2:#c7cdd8;--mid:#9aa3b2;--mid-2:#6b7384;--rule:#333a47;--rule-soft:#2a303b;--terra:#e2703a;--terra-deep:#f2a06a;--terra-soft:#5a3a28;--terra-wash:#2a2018;--green:#34d399;--green-wash:#14271e;--green-line:#1e4d38;--amber:#e0a93b;--amber-deep:#f0c060;--amber-wash:#2a2310;--rose:#e07a5f;--rose-deep:#f09070;--rose-soft:#5a3020;--rose-wash:#2a1a14;--pop-shadow:0 12px 30px -10px rgba(0,0,0,.6);--hot-shadow:0 4px 14px rgba(0,0,0,.4); }

/* Severity scale shared with the app (lib/severity.ts): clear · watch · at-risk · critical */
:root { --sev-clear: var(--green); --sev-watch: var(--amber); --sev-atrisk: var(--terra); --sev-critical: var(--rose); }

/* project-state-app look for artifacts. Components follow the app's two dialects: square Tailwind-style
   cards and tables (dashboard, kanban, settings) and the editorial .psa header (eyebrow, h1, lede, stats).
   Every color comes from tokens.css. */

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--ps-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
button, select, input { font: inherit; color: inherit; }
a { color: var(--terra-deep); }
:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--ps-serif); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.mono { font-family: var(--ps-mono); font-size: 12px; }
.muted { color: var(--mid); }
.faint { color: var(--mid-2); }
.num { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

/* ── top bar (left-nav.tsx data-nav="top") ─────────────────────────────── */
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; min-height: var(--topnav-h); background: var(--paper-side); border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 6px; padding: 0 12px; flex-wrap: wrap; }
.wordmark { display: flex; align-items: center; gap: 9px; font-family: var(--ps-serif); font-weight: 700; font-size: 13px; letter-spacing: 0.04em; color: var(--ink); white-space: nowrap; padding-right: 4px; }
.wordmark .diamond { width: 9px; height: 9px; background: var(--terra); transform: rotate(45deg); flex: none; }
.wordmark .dot { color: var(--terra); }
.vdiv { width: 1px; height: 20px; background: var(--rule); margin: 0 4px; flex: none; }
.ctx { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px; }
.ctx svg { color: var(--mid); }
.ctx select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; font-family: var(--ps-serif); font-weight: 700; font-size: 12px; color: var(--terra-deep); cursor: pointer; padding: 0 16px 0 0; max-width: 42vw; background-image: linear-gradient(45deg, transparent 50%, var(--terra-deep) 50%), linear-gradient(135deg, var(--terra-deep) 50%, transparent 50%); background-position: calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-size: 4px 4px; background-repeat: no-repeat; }
.navitems { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.nitem { height: 32px; padding: 0 10px; font-family: var(--ps-serif); font-size: 13.5px; font-weight: 600; color: var(--mid); background: none; border: 0; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.nitem:hover { color: var(--ink); background: var(--rule-soft); }
.nitem.hl { color: var(--terra-deep); font-weight: 700; }
.nitem[aria-current="page"] { background: var(--terra); color: #fff; font-weight: 700; }
.nitem.group-on { background: var(--terra-wash); color: var(--terra-deep); }
.nitem[aria-expanded="true"] { background: var(--raised); color: var(--ink); }
.nitem .chev { transition: transform 0.12s; }
.nitem[aria-expanded="true"] .chev { transform: rotate(180deg); }
.nitem svg { width: 14px; height: 14px; }
.topright { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--rule); color: var(--terra-deep); cursor: pointer; }
.iconbtn[aria-expanded="true"] { background: var(--terra); color: #fff; border-color: var(--terra); }
.group { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); left: 0; width: 320px; background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--pop-shadow); padding: 6px; z-index: 60; }
.menu.right { left: auto; right: 0; }
.menu-head { padding: 6px 8px 8px; }
.menu-head .k { font-family: var(--ps-serif); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mid-2); }
.menu-head .t { font-size: 10.5px; font-style: italic; color: var(--mid-2); }
.mrow { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; cursor: pointer; }
.mrow:hover { background: var(--rule-soft); }
.mrow[aria-current="page"] { background: var(--terra-wash); }
.mrow .ic { width: 30px; height: 30px; display: grid; place-items: center; background: var(--raised-2); border: 1px solid var(--rule); color: var(--terra); }
.mrow .ic svg { width: 15px; height: 15px; }
.mrow .l { font-family: var(--ps-serif); font-size: 13.5px; font-weight: 600; color: var(--ink); display: block; }
.mrow .d { font-size: 11.5px; color: var(--mid-2); display: block; line-height: 1.3; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 8px 8px; }
.swatch { border: 1px solid var(--rule); background: var(--raised-2); padding: 6px; cursor: pointer; display: grid; gap: 4px; text-align: left; font-size: 11px; color: var(--ink-2); }
.swatch[aria-pressed="true"] { outline: 2px solid var(--terra); outline-offset: 1px; }
.swatch i { display: flex; height: 12px; } .swatch i b { flex: 1; }
@media (max-width: 760px) { .menu { position: fixed; left: 8px; right: 8px; width: auto; top: calc(var(--topnav-h) + 8px + env(safe-area-inset-top, 0px)); } .ctx select { max-width: 60vw; } }

/* ── status bar (agent-status-bar.tsx) ─────────────────────────────── */
.statusbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(28px + env(safe-area-inset-bottom, 0px)); padding: 0 14px env(safe-area-inset-bottom, 0px); background: var(--raised); border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 16px; font-family: var(--ps-serif); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid-2); z-index: 40; overflow: hidden; white-space: nowrap; }
.statusbar .light { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; vertical-align: 1px; }
.statusbar .light.amber { background: var(--amber); } .statusbar .light.red { background: var(--rose); }

/* ── page ─────────────────────────────────────────────────────────── */
.page { max-width: 1400px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 48px; display: grid; gap: 18px; min-width: 0; }
@media (max-width: 560px) { .page { padding-inline: 16px; } }
.view > .page { padding: 0; }
.kicker { font-family: var(--ps-mono); font-size: 12px; color: var(--mid-2); }
.kicker b { color: var(--ink-2); }
.kicker .sl { color: var(--rule); margin: 0 6px; }
.eyebrow { font-family: var(--ps-serif); font-weight: 700; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid); }
.phead { display: grid; gap: 6px; }
h1 { font-weight: 500; font-size: clamp(26px, 3.2vw, 36px); line-height: 1.08; letter-spacing: -0.02em; }
h1 em { font-style: normal; background: linear-gradient(var(--terra-soft), var(--terra-soft)) no-repeat 0 1.02em / 100% 0.16em; }
h2 { font-size: 14px; font-weight: 700; color: var(--ink); }
h3 { font-size: 14px; font-weight: 700; }
.lede { font-size: 16px; line-height: 1.5; color: var(--ink-2); max-width: 70ch; margin: 2px 0 0; }
.tstats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-family: var(--ps-mono); font-size: 12px; color: var(--mid); }
.tstats b { font-family: var(--ps-serif); font-weight: 700; color: var(--ink); font-size: 14px; margin-right: 3px; }
.tstats .warn b { color: var(--terra-deep); }

/* cards (dashboard-app section card) */
.section { display: grid; gap: 0; min-width: 0; background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--card-shadow); }
.section > .section-head { padding: 11px 18px; border-bottom: 1px solid var(--rule-soft); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head .sub { font-size: 12px; color: var(--mid-2); }
.section > .panel { border: 0; box-shadow: none; background: transparent; }
.panel { background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--card-shadow); min-width: 0; }
.panel-pad { padding: 14px 18px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .grid-2 { grid-template-columns: 1fr; } }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { padding: 9px 12px 10px; display: grid; gap: 4px; align-content: start; background: var(--raised); border: 1px solid var(--rule); }
.stat .l { order: -1; font-family: var(--ps-serif); font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid-2); line-height: 1.2; }
.stat .v { font-family: var(--ps-serif); font-size: 24px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--ink); }
.stat .v small { font-size: 13px; color: var(--mid); font-weight: 500; }
.stat .s { font-size: 11.5px; color: var(--mid); }
.stat.crit .v { color: var(--rose); } .stat.warn .v { color: var(--amber); } .stat.good .v { color: var(--green); } .stat.accent { background: var(--terra-wash); border-color: var(--terra-soft); }
.bar { height: 4px; background: var(--raised-2); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }
.meter { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; } .meter > span { display: block; height: 100%; background: var(--terra); }

/* lists */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; padding: 9px 18px; border-top: 1px solid var(--rule-soft); }
.rows > .row:first-child { border-top: 0; }
.row .when { font-family: var(--ps-mono); font-size: 11.5px; color: var(--mid); white-space: nowrap; min-width: 72px; }
.row .what { min-width: 0; }
.row .title { overflow-wrap: anywhere; color: var(--ink); }
.row .sub { font-size: 12px; color: var(--mid-2); overflow-wrap: anywhere; }
.row.clickable { cursor: pointer; } .row.clickable:hover { background: var(--raised-2); }
.empty { padding: 14px 18px; color: var(--mid-2); font-style: italic; font-size: 13px; }

/* chips, pills, severity */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1; padding: 4px 8px; border-radius: 999px; background: var(--stone-chip); color: var(--mid); white-space: nowrap; font-weight: 600; font-family: var(--ps-serif); }
.chip.id { font-family: var(--ps-mono); font-weight: 700; border-radius: 3px; color: var(--ink-2); font-size: 11px; }
.chip.good { background: var(--green-wash); color: var(--green); } .chip.warn { background: var(--amber-wash); color: var(--amber-deep); } .chip.crit { background: color-mix(in srgb, var(--rose) 14%, var(--raised)); color: var(--rose); } .chip.accent { background: var(--terra-wash); color: var(--terra-deep); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sev { display: inline-flex; align-items: center; gap: 6px; font-family: var(--ps-serif); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.sev::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sev.clear { background: var(--green-wash); color: #1c7a40; } .sev.watch { background: #fbf0d8; color: #8a5a09; } .sev.at-risk { background: var(--terra-wash); color: var(--terra-deep); } .sev.critical { background: color-mix(in srgb, var(--rose) 14%, var(--raised)); color: var(--rose); }
:root[data-ps-theme="midnight"] .sev.clear, :root[data-theme="dark"]:not([data-ps-pinned]) .sev.clear { color: var(--green); } :root[data-ps-theme="midnight"] .sev.watch, :root[data-theme="dark"]:not([data-ps-pinned]) .sev.watch { background: var(--amber-wash); color: var(--amber); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-ps-pinned]) .sev.clear { color: var(--green); } :root:not([data-theme="light"]):not([data-ps-pinned]) .sev.watch { background: var(--amber-wash); color: var(--amber); } }
.filter { border: 1px solid var(--rule); background: var(--raised); cursor: pointer; padding: 5px 10px; font-family: var(--ps-serif); font-size: 12px; font-weight: 600; color: var(--ink-2); border-radius: 6px; }
.filter:hover { border-color: var(--terra); color: var(--terra-deep); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

// ── formatting ──────────────────────────────────────────────────────────────
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const d8 = (s) => (s ? new Date(String(s).slice(0, 10) + 'T00:00:00Z') : null)
PS.fmt = {
  day(s) { const d = d8(s); return d && !isNaN(d) ? `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}` : '—' },
  date(s) { const d = d8(s); return d && !isNaN(d) ? `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}` : '—' },
  short(s) { const d = d8(s); return d && !isNaN(d) ? `${d.getUTCDate()} ${MON[d.getUTCMonth()]}` : '—' },
  daysBetween(a, b) { return Math.round((d8(b) - d8(a)) / 864e5) },
  stamp(iso) { if (!iso) return 'unknown'; const d = new Date(iso); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}, ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')} UTC` },
  ago(iso) { if (!iso) return ''; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago` },
  person(s) { if (!s) return ''; return String(s).replace(/@.*$/, '').replace(/[-_.]/g, ' ').replace(/\b(worksona|atomic47)\b/g, '').trim() },
  money(n) { if (n == null || isNaN(n)) return '—'; return n >= 1e6 ? `$${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `$${Math.round(n / 1e3)}K` : `$${Number(n).toFixed(n < 10 ? 2 : 0)}` },
  num(n) { return n == null ? '—' : Number(n).toLocaleString('en-CA') },
  statusClass(s) {
    const v = String(s || '').toLowerCase()
    if (['complete', 'completed', 'delivered', 'accepted', 'done', 'decided', 'on-track', 'on_track', 'closed', 'met', 'achieved', 'sent', 'approved', 'resolved', 'fixed', 'healthy'].includes(v)) return 'good'
    if (['at-risk', 'at_risk', 'blocked', 'off-track', 'off_track', 'overdue', 'open', 'proposed', 'queued', 'triage', 'new'].includes(v)) return 'warn'
    if (['in_progress', 'in-progress', 'active', 'started', 'capturing'].includes(v)) return 'accent'
    return ''
  },
  label(s) { return String(s ?? '—').replace(/[_-]/g, ' ') },
}

// ── snapshot mode ───────────────────────────────────────────────────────────
// A page built by snapshot.mjs carries its data: window.PS_SNAPSHOT = {taken, source, calls: {"<tool> <input>": payload}}.
// It answers the views' reads from that record instead of a connector, so a project that lives only on this computer
// (read through the plugin's local project-state server when the page was built) shows in an artifact with no
// connector, no cloud and no host bridge. Codex refreshes it by recording the local file again.
PS.snapshot = window.PS_SNAPSHOT || null
const canon = (v) => (Array.isArray(v) ? `[${v.map(canon).join(',')}]` : v && typeof v === 'object' ? `{${Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => `${JSON.stringify(k)}:${canon(v[k])}`).join(',')}}` : JSON.stringify(v ?? null))
PS.callKey = (tool, input) => { const { rev, ...rest } = input || {}; return `${tool} ${canon(rest)}` }
function snapshotMcp(snap) {
  const miss = (tool) => ({ code: 'not_in_snapshot', message: `${tool} was not captured` })
  const find = (tool, input) => snap.calls[PS.callKey(tool, input)]
  return {
    callTool: async (server, tool, input) => { const r = find(tool, input); if (r === undefined) throw miss(tool); return { payload: r, content: [] } },
    watchTool: (server, tool, input, handler) => {
      const r = find(tool, input)
      queueMicrotask(() => handler(r === undefined ? { type: 'error', error: miss(tool) } : { type: 'data', result: { payload: r, content: [] } }))
      return () => {}
    },
    listTools: async () => ({ servers: [] }),
  }
}

// ── boot ────────────────────────────────────────────────────────────────────
PS.boot = async function boot({ viewIds, single, title }) {
  const root = document.getElementById('app')
  if (PS.snapshot) viewIds = viewIds.filter((v) => v !== 'admin' && v !== 'runs') // org administration and the cloud scheduler have no meaning for a folder on disk
  const mcp = PS.snapshot ? snapshotMcp(PS.snapshot) : null
  applyTheme(null)
  if (!mcp) { setChildren(root, noConnector('No recorded project data was included in this file.')); return }
  PS.mcp = mcp

  let projects
  try { projects = (await mcp.callTool(PS.SERVER, 'project_list', null, { cache: { staleTime: 60000 } })).payload?.projects || [] }
  catch (err) { setChildren(root, DENIALS.has(err?.code) ? noConnector(explain(err)) : errorState('Couldn\'t load your projects', explain(err))); return }
  if ((viewIds.includes('admin') || viewIds.includes('runs')) && !PS.snapshot) PS.me = (await mcp.callTool(PS.SERVER, 'whoami', null, { cache: { staleTime: 60000 } }).catch(() => null))?.payload || null
  const isAdmin = !!(PS.me && (PS.me.superadmin || PS.me.orgs?.some((o) => o.role === 'admin')))
  if (!projects.length && !isAdmin) { setChildren(root, h('main', { class: 'page' }, h('div', { class: 'panel state' }, h('strong', {}, 'No projects yet'), 'Your account can sign in but has no projects allocated. Ask an org admin to give you access.'))); return }
  if (!projects.length) viewIds = viewIds.filter((v) => v === 'admin' || v === 'runs') // an admin with no projects of their own

  const saved = store.get('ps.project')
  PS.projects = projects
  PS.project = projects.find((p) => p.project === saved) ? saved : projects[0]?.project || null
  PS.current = () => projects.find((p) => p.project === PS.project)
  applyTheme(PS.current())
  const page = h('main', { class: 'page', id: 'page' })
  const shell = buildShell({ viewIds, single, title })
  setChildren(root, shell.top, page, shell.status)

  let current = null, unsub = []
  PS.setFresh = (asOf) => shell.fresh(asOf)
  PS.reload = () => { if (current) show(current) }
  PS.go = (id) => { if (viewIds.includes(id)) show(id) }
  PS.has = (id) => viewIds.includes(id)
  const show = (id) => {
    unsub.forEach((u) => { try { u() } catch {} }); unsub = []
    document.querySelectorAll('.drawer, .drawer-back, .dialog').forEach((n) => n.remove())
    current = id
    shell.select(id)
    if (!single) store.set('ps.tab', id)
    const view = PS.views[id]
    document.title = single ? title : `${view.title} · Project State`
    const el = h('div', { class: 'view', 'data-view': id })
    setChildren(page, el)
    window.scrollTo(0, 0)
    view.mount(el, { project: PS.project, watch: (...a) => { const u = PS.watch(...a); unsub.push(u); return u } })
  }
  shell.onProject((p) => { PS.project = p; store.set('ps.project', p); applyTheme(PS.current()); shell.refresh(); show(current) })
  PS.shell = shell
  shell.onNav(show)
  shell.onTheme(() => applyTheme(PS.current()))
  const fromHash = location.hash.replace('#', '')
  show(single ? viewIds[0] : viewIds.includes(fromHash) ? fromHash : viewIds.includes(store.get('ps.tab')) ? store.get('ps.tab') : viewIds[0])
  if (!single) window.addEventListener('hashchange', () => { const t = location.hash.replace('#', ''); if (viewIds.includes(t) && t !== current) show(t) })
}

// Watch a view tool and route every outcome into one element.
PS.watch = function watch(section, tool, input, render, opts = {}) {
  let hadData = false
  setChildren(section, h('div', { class: 'loading' }, opts.loading || 'Loading'))
  if (PS.rev) input = { ...input, rev: PS.rev }
  return PS.mcp.watchTool(PS.SERVER, tool, input, (ev) => {
    if (ev.type === 'data') {
      hadData = true
      section.classList.remove('is-stale')
      const payload = ev.result.payload
      if (payload?.as_of) PS.setFresh?.(payload.as_of)
      try { render(payload, ev.result) } catch (err) { setChildren(section, errorBlock('This section couldn\'t be drawn', String(err?.message || err))) }
      return
    }
    const err = ev.error
    if (DENIALS.has(err?.code) || !hadData) setChildren(section, errorBlock(DENIALS.has(err?.code) ? 'Not available' : 'Couldn\'t load this section', explain(err)))
    else section.classList.add('is-stale')
  }, { cache: { staleTime: 60000 }, ...(opts.refetch ? { refetchInterval: opts.refetch } : {}) })
}

function explain(err) {
  switch (err?.code) {
    case 'server_not_connected': return 'Ask Codex to make or refresh a local Project State snapshot.'
    case 'needs_reauth': return 'The configured project connector needs authentication before a new snapshot can be recorded.'
    case 'selection_required': return `More than one connector is named ${PS.SERVER}. Choose one when Codex asks, or rename the extra one.`
    case 'not_in_manifest': case 'consent_required': return `This page isn't allowed to use ${PS.SERVER} in this view. Allow it when Codex asks, or open the page from your own account.`
    case 'blocked_by_policy': case 'approval_required': return 'Your organization\'s policy blocks this connector here.'
    case 'server_unavailable': return 'The Project State server didn\'t answer. It will retry on its own.'
    case 'tool_error': return err.message || 'The server reported an error.'
    case 'not_in_snapshot': return 'This snapshot didn\'t capture it. Ask Codex to refresh the snapshot.'
    case 'snapshot_read_only': return 'This page is a snapshot, so it can\'t save changes. Ask Codex to make the change; it writes through your local project-state server.'
    default: return err?.message || 'Something went wrong while loading.'
  }
}
function errorBlock(title, text) { return h('div', { class: 'state err' }, h('strong', {}, title), h('span', {}, text)) }
function errorState(title, text) { return h('main', { class: 'page' }, h('div', { class: 'panel' }, errorBlock(title, text))) }

    // the Admin menu shows for org admins and superadmins (whoami, fetched once)
    const adminGroup = top.querySelector('[data-group="admin"]')?.closest('.group')
    if (adminGroup) { adminGroup.hidden = !PS.me || !(PS.me.superadmin || PS.me.orgs?.some((o) => o.role === 'admin')) }
  }
  refresh()
  return {
    top, status, refresh,
    fresh(asOf) {
      const server = cur()?.home === 'server', hrs = (Date.now() - Date.parse(asOf)) / 36e5
      light.className = `light${!server && hrs > 26 ? ' amber' : ''}`
      if (PS.snapshot) { light.className = 'light'; freshTxt.textContent = `Snapshot taken ${PS.fmt.stamp(PS.snapshot.taken)}`; return }
      freshTxt.textContent = server ? `Saved ${PS.fmt.stamp(asOf)}` : `Mirrored ${PS.fmt.stamp(asOf)}`
    },
    select(id) {
      navItems.querySelectorAll('.nitem[data-id]').forEach((b) => b.toggleAttribute('aria-current', b.dataset.id === id))
      navItems.querySelectorAll('.nitem[data-id][aria-current]').forEach((b) => b.setAttribute('aria-current', 'page'))
      menus.forEach((m) => { m.btn.classList.toggle('group-on', m.ids.includes(id)); m.menu.querySelectorAll('.mrow[data-id]').forEach((r) => (r.dataset.id === id ? r.setAttribute('aria-current', 'page') : r.removeAttribute('aria-current'))) })
      if (!single && location.hash !== '#' + id) history.replaceState(null, '', '#' + id)
    },
    onProject(fn) { select.addEventListener('change', () => fn(select.value)) },
    onNav(fn) { onNav = fn },
    onTheme(fn) { onTheme = fn },
  }
}

// A small form in a modal. fields: [{ name, label, type: text|textarea|number|date|time|select, value, options, required, hint }]
// Resolves with the values, or null when cancelled.
PS.dialog = ({ title, intro, fields = [], submit = 'Save', danger = false, also = [] }) => new Promise((resolve) => {
  const inputs = {}
  const close = (v) => { back.remove(); box.remove(); document.removeEventListener('keydown', onKey); resolve(v) }
  const onKey = (e) => { if (e.key === 'Escape') close(null) }
  const field = (f) => {
    let el
    if (f.type === 'textarea') el = h('textarea', { name: f.name, rows: f.rows || 6, required: f.required }, f.value ?? '')
    else if (f.type === 'select') el = h('select', { name: f.name }, f.options.map(([v, l]) => h('option', { value: v, selected: String(v) === String(f.value) }, l)))
    else el = h('input', { name: f.name, type: f.type || 'text', value: f.value ?? '', required: f.required, step: f.type === 'number' ? 'any' : null, placeholder: f.placeholder || null })
    inputs[f.name] = el
    return h('label', { class: 'fld' }, h('span', {}, f.label), el, f.hint ? h('small', {}, f.hint) : null)
  }
  const form = h('form', { class: 'dlg-form', onsubmit: (e) => { e.preventDefault(); const out = {}; for (const f of fields) { const v = inputs[f.name].value; out[f.name] = f.type === 'number' ? (v === '' ? null : Number(v)) : v } close(out) } },
    intro ? h('p', { class: 'muted' }, intro) : null, fields.map(field),
    h('div', { class: 'dlg-actions' },
      also.map((a) => h('button', { type: 'button', class: `btn ${a.danger ? 'danger' : 'ghost'}`, style: 'margin-right:auto', onclick: () => { const out = { _action: a.value }; for (const f of fields) out[f.name] = inputs[f.name].value; close(out) } }, a.label)),
      h('button', { type: 'button', class: 'btn ghost', onclick: () => close(null) }, 'Cancel'), h('button', { type: 'submit', class: `btn${danger ? ' danger' : ''}` }, submit)))
  const back = h('div', { class: 'drawer-back', onclick: () => close(null) })
  const box = h('div', { class: 'dialog', role: 'dialog', 'aria-label': title }, h('h2', {}, title), form)
  document.body.append(back, box)
  document.addEventListener('keydown', onKey)
  ;(Object.values(inputs)[0] || box.querySelector('button[type=submit]'))?.focus()
})

// Copy text, with fallbacks for pages whose frame blocks the clipboard API.
PS.copy = async (text, el) => {
  try { await navigator.clipboard.writeText(text); PS.toast('Copied', 'ok'); return true } catch {}
  try { if (el) { el.focus(); el.select() } if (document.execCommand('copy')) { PS.toast('Copied', 'ok'); return true } } catch {}
  if (el) { el.focus(); el.select() }
  PS.toast('Selected: press ⌘C (Mac) or Ctrl+C (Windows) to copy')
  return false
}
PS.copyBlock = (text, { rows = 3 } = {}) => {
  const ta = h('textarea', { class: 'copytext', readonly: true, rows, onclick: (e) => e.target.select() }, text)
  return h('div', { class: 'copyblock' }, ta, h('button', { type: 'button', class: 'btn small', onclick: () => PS.copy(text, ta) }, 'Copy'))
}

// Run one change through the connector. The server checks access, applies it with the app's own code,
// stamps who and when, and logs it. On success the page's reads refresh.
PS.act = async (tool, args, { confirm, done, quiet } = {}) => {
  if (PS.snapshot) { PS.toast(explain({ code: 'snapshot_read_only' }), 'err'); return null }
  // the artifact viewer never shows window.confirm (it returns false at once), so ask in the page itself
  if (confirm && !(await PS.dialog({ title: 'Are you sure?', intro: confirm, submit: 'Confirm', danger: /delete|remove|disable|stop|revoke|return .* to the cloud|writable/i.test(confirm) }))) return null
  try {
    const r = await PS.mcp.callTool(PS.SERVER, tool, { project: PS.project, ...args })
    const payload = r?.payload
    if (r?.isError || payload?.error) throw Object.assign(new Error(payload?.error || r?.content?.[0]?.text || 'The change was refused'), { code: 'tool_error' })
    PS.rev++
    if (!quiet) PS.toast(done || 'Saved', 'ok')
    PS.reload?.()
    return payload
  } catch (err) {
    PS.toast(explain(err), 'err')
    return null
  }
}

// Detail drawer: reads one substrate file through get_entity (a one-off action, so callTool).
PS.openEntity = async function openEntity(path, title) {
  const close = () => { back.remove(); dr.remove(); document.removeEventListener('keydown', onKey) }
  const onKey = (e) => { if (e.key === 'Escape') close() }
  const body = h('div', { class: 'drawer-body' }, h('div', { class: 'loading' }, 'Reading the file'))
  const back = h('div', { class: 'drawer-back', onclick: close })
  const dr = h('aside', { class: 'drawer', role: 'dialog', 'aria-label': title || path }, h('div', { class: 'drawer-head' }, h('h2', {}, title || path), h('button', { class: 'close', onclick: close }, 'Close')), body)
  document.body.append(back, dr)
  document.addEventListener('keydown', onKey)
  dr.querySelector('.close').focus()
  try {
    const r = (await PS.mcp.callTool(PS.SERVER, 'get_entity', { project: PS.project, path, ...(PS.rev ? { rev: PS.rev } : {}) }, { cache: { staleTime: 60000 } })).payload
    const d = r.data && typeof r.data === 'object' && !Array.isArray(r.data) ? r.data : {}
    const skip = new Set(['title', 'kind', 'created_by', 'last_modified_by', 'jira_key'])
    const flat = Object.entries(d).filter(([k, v]) => !skip.has(k) && v != null && typeof v !== 'object')
    const nested = Object.entries(d).filter(([, v]) => v && typeof v === 'object')
    const isMd = /\.md$/.test(path)
    setChildren(body,
      h('div', { class: 'mono muted' }, path),
      flat.length ? h('dl', { class: 'kv' }, flat.flatMap(([k, v]) => [h('dt', {}, PS.fmt.label(k)), h('dd', {}, typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) ? PS.fmt.date(v) : String(v))])) : null,
      isMd ? h('div', { class: 'prose' }, PS.md(String(r.raw || '').replace(/^---\n[\s\S]*?\n---\n?/, ''))) : null,
      ...nested.map(([k, v]) => h('details', { open: nested.length < 3 }, h('summary', {}, PS.fmt.label(k)), h('pre', { class: 'raw' }, JSON.stringify(v, null, 2)))),
      h('details', {}, h('summary', {}, 'Source file'), h('pre', { class: 'raw' }, r.raw || '')),
      drawerActions(path, r, close))
  } catch (err) { setChildren(body, errorBlock('Couldn\'t read this file', explain(err))) }
}

// History and, for editors, a raw editor. The edit carries the file's hash, so a change someone made
// in the meantime is refused rather than overwritten.
function drawerActions(path, r, close) {
  const hist = h('div', {})
  const showHistory = async () => {
    setChildren(hist, h('div', { class: 'loading' }, 'Reading the history'))
    try {
      const x = (await PS.mcp.callTool(PS.SERVER, 'history', { project: PS.project, path, ...(PS.rev ? { rev: PS.rev } : {}) })).payload
      const rows = [...(x.revisions || []).map((v) => ({ ts: v.at, who: v.by, what: `${v.op} · ${v.label || ''}` })), ...(x.events || []).map((e) => ({ ts: e.ts, who: e.actor, what: `${e.event}${e.detail ? ' · ' + e.detail : ''}` }))]
        .sort((a, b) => String(b.ts).localeCompare(String(a.ts))).slice(0, 40)
      setChildren(hist, h('h3', { class: 'dh' }, 'History'), rows.length ? h('ul', { class: 'rows' }, rows.map((x) => h('li', { class: 'row', style: 'grid-template-columns:130px 1fr' }, h('span', { class: 'mono faint' }, PS.fmt.stamp(x.ts)), h('span', { class: 'what' }, h('div', { class: 'title' }, x.what), h('div', { class: 'sub' }, x.who || ''))))) : PS.empty('No recorded changes.'))
    } catch (err) { setChildren(hist, errorBlock('Couldn\'t read the history', explain(err))) }
  }
  const editable = PS.canWrite() && /\.(ya?ml|md|json)$/.test(path) && !r.truncated
  const edit = async () => {
    const v = await PS.dialog({ title: `Edit ${path.split('/').pop()}`, intro: 'Changes save to the cloud copy, stamped with your email. If someone changed this file since you opened it, the save is refused.', fields: [{ name: 'content', label: 'File', type: 'textarea', rows: 22, value: r.raw || '' }], submit: 'Save file' })
    if (v && v.content !== r.raw && await PS.act('entity_put', { path, content: v.content, base_sha256: r.sha256 }, { done: 'File saved' })) close()
  }
  return h('div', { class: 'drawer-actions' },
    h('div', { class: 'chips' }, PS.actBtn('History', showHistory, { cls: 'ghost', icon: 'history' }), editable ? PS.actBtn('Edit', edit, { icon: 'pen' }) : null),
    hist)
}

// Minimal, safe markdown: headings, lists, emphasis, code, links, [[wiki links]]. Text only, no raw HTML.
PS.md = (src, { onWiki } = {}) => {
  const out = document.createDocumentFragment()
  const inline = (text) => {
    const frag = document.createDocumentFragment()
    const re = /(\[\[([^\]|]+)(?:\|([^\]]+))?\]\])|(\*\*([^*]+)\*\*)|(`([^`]+)`)|(\[([^\]]+)\]\((https?:[^)\s]+)\))|(\*([^*]+)\*)/g
    let last = 0, m
    while ((m = re.exec(text))) {
      if (m.index > last) frag.append(text.slice(last, m.index))
      if (m[1]) { const target = m[2].includes('::') ? m[2].split('::')[1] : m[2]; const a = h('a', { class: 'wl', onclick: onWiki ? () => onWiki(target.trim()) : null }, m[3] || target); frag.append(a) }
      else if (m[4]) frag.append(h('strong', {}, m[5]))
      else if (m[6]) frag.append(h('code', {}, m[7]))
      else if (m[8]) frag.append(h('a', { href: m[10], target: '_blank', rel: 'noopener' }, m[9]))
      else if (m[11]) frag.append(h('em', {}, m[12]))
      last = re.lastIndex
    }
    if (last < text.length) frag.append(text.slice(last))
    return frag
  }
  let list = null, para = []
  const flush = () => { if (para.length) { out.append(h('p', {}, inline(para.join(' ')))); para = [] } }
  for (const line of String(src).split('\n')) {
    const hm = line.match(/^(#{1,4})\s+(.*)/), li = line.match(/^\s*([-*]|\d+\.)\s+(.*)/)
    if (hm) { flush(); list = null; out.append(h(`h${Math.min(4, hm[1].length + 1)}`, {}, inline(hm[2]))) }
    else if (li) { flush(); if (!list) { list = h(/\d/.test(li[1]) ? 'ol' : 'ul'); out.append(list) } list.append(h('li', {}, inline(li[2]))) }
    else if (!line.trim()) { flush(); list = null }
    else { list = null; para.push(line.trim()) }
  }
  flush()
  return out
}

      const m = v.milestones

      const segs = (parts) => h('div', { class: 'bar', role: 'img', 'aria-label': parts.map((p) => `${p.n} ${p.label}`).join(', ') }, parts.filter((p) => p.n).map((p) => h('span', { style: `width:${(100 * p.n) / Math.max(1, parts.reduce((a, b) => a + b.n, 0))}%;background:${p.color}`, title: `${p.n} ${p.label}` })))
      const planned = m.total - m.done - m.in_progress
      const rl = v.risks.by_level
      const objs = Object.entries(v.objectives.by_status)

      setChildren(wrap,
        PS.head({ section: `Dashboard${v.phase_preset ? ' · ' + v.phase_preset + ' preset' : ''}`, title: v.name || v.project, lede: v.description,
          stats: [[v.current_phase || '—', 'phase'], [`${m.percent_done}%`, 'done'], [m.overdue, 'past their end date', m.overdue > 0], [v.risks.open, 'open risks']] }),
        h('div', { class: 'stats' },
          tile(h('span', {}, m.percent_done, h('small', {}, '%')), `${m.done} of ${m.total} milestones done`, '', segs([{ n: m.done, label: 'done', color: 'var(--green)' }, { n: m.in_progress, label: 'in progress', color: 'var(--terra)' }, { n: planned, label: 'planned', color: 'var(--rule)' }])),
          tile(m.in_progress, 'milestones in progress'),
          tile(m.overdue, 'milestones past their end date', m.overdue ? 'crit' : 'good'),
          tile(v.risks.open, 'open risks', rl.high ? 'warn' : '', segs([{ n: rl.high, label: 'high', color: 'var(--rose)' }, { n: rl.medium, label: 'medium', color: 'var(--amber)' }, { n: rl.low, label: 'low', color: 'var(--green)' }, { n: rl.unrated, label: 'unrated', color: 'var(--rule)' }])),
          tile(v.decisions.open, 'decisions open', v.decisions.open ? 'warn' : ''),
          tile(v.objectives.total, objs.map(([k, n]) => `${n} ${fmt.label(k)}`).join(' · ') || 'objectives')),
        gantt(v),
        h('div', { class: 'grid-2' },
          list('Past their end date', m.overdue_top, v.today, true),
          list('Next due', m.next_due, v.today, false)))
    })

    function list(title, items, today, late) {
      const s = PS.section(title)
      setChildren(s.body, items.length ? h('ul', { class: 'rows' }, items.map((x) => h('li', { class: 'row clickable', onclick: () => PS.openEntity(x.path, x.title) },
        h('span', { class: 'when' }, fmt.short(x.planned_end)),
        h('span', { class: 'what' }, h('div', { class: 'title' }, x.title), h('div', { class: 'sub' }, fmt.label(x.status), x.owner ? ` · ${fmt.person(x.owner)}` : '')),
        h('span', { class: 'chips' }, late ? PS.chip(`${fmt.daysBetween(x.planned_end, today)} d late`, 'crit') : PS.chip(`in ${fmt.daysBetween(today, x.planned_end)} d`), PS.idChip(x.id))))) : h('div', { class: 'empty' }, late ? 'Nothing is late.' : 'Nothing scheduled.'))
      return s.el
    }

    function gantt(v) {
      const s = PS.section('Milestone timeline', h('span', { class: 'chips' }, PS.chip('done', 'good'), PS.chip('in progress', 'accent'), PS.chip('planned'), PS.chip('late', 'crit')))
      const rows = v.gantt.rows
      if (!rows.length || !v.gantt.start) { setChildren(s.body, h('div', { class: 'empty' }, 'No milestones have dates yet.')); return s.el }
      const t0 = Date.parse(v.gantt.start < v.today ? v.gantt.start : v.today), t1 = Date.parse(v.gantt.end > v.today ? v.gantt.end : v.today)
      const pad = (t1 - t0) * 0.02, a = t0 - pad, b = t1 + pad
      const W = 1100, LABEL = 250, RH = 22, TOP = 30, H = TOP + rows.length * RH + 8
      const x = (d) => LABEL + ((Date.parse(d) - a) / (b - a)) * (W - LABEL - 10)
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('role', 'img')
      svg.setAttribute('aria-label', `Timeline of ${rows.length} milestones`)
      const add = (tag, attrs, text) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, val] of Object.entries(attrs)) n.setAttribute(k, val); if (text != null) n.textContent = text; svg.append(n); return n }
      // month ticks
      const d = new Date(a); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + 1)
      for (; d.getTime() < b; d.setUTCMonth(d.getUTCMonth() + 1)) {
        const iso = d.toISOString().slice(0, 10), X = x(iso)
        add('line', { x1: X, x2: X, y1: TOP - 6, y2: H - 4, stroke: 'var(--rule)', 'stroke-width': 1 })
        add('text', { x: X + 3, y: TOP - 12, 'font-size': 11, fill: 'var(--mid-2)', 'font-family': 'var(--ps-mono)' }, `${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()]}${d.getUTCMonth() === 0 ? ` ’${String(d.getUTCFullYear()).slice(2)}` : ''}`)
      }
      rows.forEach((r, i) => {
        const y = TOP + i * RH
        const g = add('g', { class: 'g-row', style: 'cursor:pointer', tabindex: 0, role: 'button', 'aria-label': `${r.id} ${r.title}` })
        g.addEventListener('click', () => PS.openEntity(r.path, r.title))
        g.addEventListener('keydown', (e) => { if (e.key === 'Enter') PS.openEntity(r.path, r.title) })
        const mk = (tag, attrs, text) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, val] of Object.entries(attrs)) n.setAttribute(k, val); if (text != null) n.textContent = text; g.append(n); return n }
        if (i % 2 === 0) mk('rect', { x: 0, y, width: W, height: RH, fill: 'var(--raised-2)', opacity: 0.5 })
        const id = String(r.id || '').match(/^[A-Z]+-?\d+/)?.[0] || r.id
        mk('text', { x: 8, y: y + 15, 'font-size': 11, fill: 'var(--mid-2)', 'font-family': 'var(--ps-mono)' }, id)
        const title = String(r.title || '').length > 30 ? String(r.title).slice(0, 29) + '…' : r.title
        mk('text', { x: 58, y: y + 15, 'font-size': 12, fill: 'var(--ink)', 'font-family': 'var(--ps-body)' }, title)
        const s0 = r.planned_start || r.planned_end, e0 = r.done && r.actual_end ? r.actual_end : r.planned_end || r.planned_start
        const X0 = x(s0), X1 = Math.max(X0 + 4, x(e0))
        const status = String(r.status || '').toLowerCase()
        const fill = r.done ? 'var(--green)' : ['in_progress', 'in-progress', 'active'].includes(status) ? 'var(--terra)' : 'var(--raised)'
        mk('rect', { x: X0, y: y + 5, width: X1 - X0, height: RH - 10, rx: 3, fill, stroke: r.overdue ? 'var(--rose)' : r.done ? 'var(--green)' : 'var(--mid-2)', 'stroke-width': r.overdue ? 1.5 : 1 })
        if (r.overdue) mk('circle', { cx: X1, cy: y + RH / 2, r: 3.5, fill: 'var(--rose)' })
        mk('title', {}, `${r.id} · ${r.title}\n${r.planned_start || '?'} → ${r.planned_end || '?'} · ${r.status}${r.overdue ? ' · late' : ''}`)
      })
      const T = x(v.today)
      add('line', { x1: T, x2: T, y1: TOP - 20, y2: H - 4, stroke: 'var(--rose)', 'stroke-width': 1.5, 'stroke-dasharray': '3 3' })
      add('text', { x: T + 4, y: TOP - 22 + 8, 'font-size': 11, fill: 'var(--rose)', 'font-family': 'var(--ps-mono)' }, 'today')
      setChildren(s.body, h('div', { class: 'scroll-x', style: 'padding:6px 0' }, svg))
      return s.el
    }
  },
}

PS.views.board = {

        h('div', { class: 'bcard-top' }, PS.idChip(m.id), m.overdue ? PS.chip(`${fmt.daysBetween(m.planned_end, v.today)} d late`, 'crit') : null),

        PS.canWrite() ? h('div', { class: 'bcard-acts' }, move(m)) : null)
      const cols = v.columns.map((c) => {

        h('div', { class: 'chips' }, toggle, v.cancelled.length ? PS.chip(`${v.cancelled.length} cancelled, not shown`) : null, PS.canWrite() ? h('span', { class: 'muted', style: 'font-size:12px' }, 'Change a card\'s status to move it.') : null),

    })

}

PS.views.calendar = {
  tab: 'Calendar', title: 'Calendar', icon: 'calendar', desc: 'Deliverables, deadlines and meetings by month', tools: ['due_between', 'get_entity', 'view_meetings', 'meeting_save'],
  mount(el, { project, watch }) {
    const { h, fmt } = PS
    const now = new Date()
    let year = now.getUTCFullYear(), month = now.getUTCMonth()
    let stop = null, stopM = null, meetings = [], redraw = null
    const hidden = h('div', { hidden: true })
    const wrap = h('div', { class: 'page', style: 'padding:0' })
    const body = h('div', {})
    el.append(wrap)
    const iso = (d) => d.toISOString().slice(0, 10)
    const KIND = { milestone: 'accent', decision: 'warn', report: '', objective: 'good', 'sc-meeting': 'good', meeting: 'meet' }
    const meetingFields = (m = {}) => [
      { name: 'title', label: 'Title', value: m.title || '', required: true },
      { name: 'date', label: 'Date', type: 'date', value: m.date || iso(new Date()), required: true },
      { name: 'time', label: 'Time', type: 'time', value: m.time || '' },
      { name: 'duration_min', label: 'Minutes', type: 'number', value: m.duration_min ?? 30 },
      { name: 'location', label: 'Where', value: m.location || '', placeholder: 'room or video link' },
      { name: 'attendees', label: 'Who', value: (m.attendees || []).join(', '), hint: 'comma-separated names or emails' },
      { name: 'notes', label: 'Notes', type: 'textarea', rows: 4, value: m.notes || '' }]
    const clean = (v) => ({ title: v.title, date: v.date, ...(v.time ? { time: v.time } : {}), ...(v.duration_min ? { duration_min: Number(v.duration_min) } : {}), ...(v.location ? { location: v.location } : {}), attendees: String(v.attendees || '').split(',').map((x) => x.trim()).filter(Boolean), ...(v.notes ? { notes: v.notes } : {}) })
    async function addMeeting() {
      const v = await PS.dialog({ title: 'New meeting', fields: meetingFields(), submit: 'Add meeting' })
      if (v) PS.act('meeting_save', clean(v), { done: `${v.title} added on ${fmt.day(v.date)}` })
    }
    async function openMeeting(m) {
      if (!PS.canWrite()) return PS.openEntity(`events/${m.id}.yaml`, m.title)
      if (m.external) { PS.toast('This is a Google Calendar mirror: change it in Google Calendar.'); return }
      const v = await PS.dialog({ title: m.title, fields: meetingFields(m), submit: 'Save', also: [{ label: 'Delete', value: 'delete', danger: true }] })
      if (!v) return
      if (v._action === 'delete') PS.act('meeting_save', { id: m.id, delete: true }, { confirm: `Delete "${m.title}"?`, done: 'Meeting deleted' })
      else PS.act('meeting_save', { id: m.id, ...clean(v) }, { done: 'Meeting saved' })
    }

    function load() {
      const first = new Date(Date.UTC(year, month, 1))
      const start = new Date(first); start.setUTCDate(1 - ((first.getUTCDay() + 6) % 7))
      const end = new Date(start); end.setUTCDate(start.getUTCDate() + 41)
      const title = `${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][month]} ${year}`
      const nav = (dm) => () => { month += dm; if (month < 0) { month = 11; year-- } if (month > 11) { month = 0; year++ } load() }
      setChildren(wrap,
        PS.head({ section: 'Calendar', title }),
        h('div', { class: 'chips' }, h('span', { class: 'seg' },
            h('button', { onclick: nav(-1), 'aria-label': 'Previous month' }, '← Prev'),
            h('button', { onclick: () => { year = now.getUTCFullYear(); month = now.getUTCMonth(); load() } }, 'This month'),
            h('button', { onclick: nav(1), 'aria-label': 'Next month' }, 'Next →'))),
        h('div', { class: 'chips' }, PS.chip('milestone', 'accent'), PS.chip('decision', 'warn'), PS.chip('report'), PS.chip('objective or SC date', 'good'), PS.chip('meeting', 'meet'), PS.canWrite() ? PS.actBtn('Add meeting', addMeeting, { icon: 'plus' }) : null),
        body, hidden)
      try { stop?.() } catch {}
      try { stopM?.() } catch {}
      stopM = watch(hidden, 'view_meetings', { project }, (m) => { meetings = m.meetings || []; redraw?.() })
      stop = watch(body, 'due_between', { project, start: iso(start), end: iso(end) }, (v) => { redraw = () => draw(v); draw(v) })
      function draw(v) {
        const byDay = {}
        const meet = meetings.filter((m) => m.date >= iso(start) && m.date <= iso(end)).map((m) => ({ date: m.date, kind: 'meeting', what: `meeting${m.time ? ' at ' + m.time : ''}`, title: m.title, meeting: m }))
        for (const i of [...meet, ...v.items]) (byDay[i.date] ||= []).push(i)
        const today = iso(new Date())
        const cells = []
        for (let k = 0; k < 42; k++) {
          const d = new Date(start); d.setUTCDate(start.getUTCDate() + k)
          const key = iso(d), items = byDay[key] || [], inMonth = d.getUTCMonth() === month
          cells.push(h('div', { class: `cal-cell${inMonth ? '' : ' out'}${key === today ? ' today' : ''}` },
            h('div', { class: 'cal-date mono' }, d.getUTCDate()),
            items.slice(0, 4).map((i) => h('button', { class: `cal-item chip ${KIND[i.kind] ?? ''}`, title: `${i.what}: ${i.title}`, onclick: i.meeting ? () => openMeeting(i.meeting) : i.path && i.path !== 'reporting-matrix.yaml' ? () => PS.openEntity(i.path, i.title) : null }, i.title)),
            items.length > 4 ? h('div', { class: 'muted', style: 'font-size:11px' }, `+${items.length - 4} more`) : null))
        }
        const agenda = [...meet, ...v.items].filter((i) => i.date.slice(0, 7) === `${year}-${String(month + 1).padStart(2, '0')}`).sort((a, b) => a.date.localeCompare(b.date))
        setChildren(body,
          h('div', { class: 'panel cal' }, ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => h('div', { class: 'cal-dow' }, d)), cells),
          h('section', { class: 'section cal-agenda' }, h('h2', {}, 'Agenda'),
            h('div', { class: 'panel' }, agenda.length ? h('ul', { class: 'rows' }, agenda.map((i) => h('li', { class: `row${i.meeting ? ' clickable' : ''}`, onclick: i.meeting ? () => openMeeting(i.meeting) : null },
              h('span', { class: 'when' }, fmt.day(i.date)), h('span', { class: 'what' }, h('div', { class: 'title' }, i.title), h('div', { class: 'sub' }, i.what)), PS.idChip(i.kind === 'report' ? null : i.id)))) : h('div', { class: 'empty' }, 'Nothing dated this month.'))),
          v.not_computed.length ? h('p', { class: 'muted' }, `${v.not_computed.length} reports run on events or sprints and aren't shown on the calendar: ${v.not_computed.map((n) => n.report).join(', ')}.`) : null)
      }
    }
    load()
  },
}

PS.views.goals = {
  tab: 'Goals', title: 'Goals', icon: 'target', desc: 'Objectives and KPIs, attainment and trend', tools: ['view_goals', 'get_entity', 'kpi_reading', 'objective_status'],
  mount(el, { project, watch }) {
    const { h, fmt } = PS
    const wrap = h('div', { class: 'page', style: 'padding:0' })
    el.append(wrap)
    watch(wrap, 'view_goals', { project }, (v) => {
      const counts = {}
      for (const o of v.objectives) counts[o.status || 'unset'] = (counts[o.status || 'unset'] || 0) + 1
      setChildren(wrap,
        PS.head({ section: 'Goals', title: h('span', {}, `${v.objectives.length} objectives, `, h('em', {}, `${v.objectives.reduce((n, o) => n + o.kpis.length, 0)} KPIs`)), lede: 'The outcome layer over milestones: each objective with the KPIs that prove it, from baseline to target.', stats: Object.entries(counts).map(([s, n]) => [n, fmt.label(s), /risk|off/.test(s)]) }),
        h('div', { class: 'goals' }, v.objectives.map((o) => objective(o, v.today))),
        v.unlinked_kpis.length ? h('section', { class: 'section' }, h('h2', {}, 'KPIs not linked to an objective'), h('div', { class: 'panel' }, h('ul', { class: 'rows' }, v.unlinked_kpis.map(kpiRow)))) : null)
    })

    const OBJ = ['on-track', 'at-risk', 'off-track', 'achieved', 'dropped']
    function objective(o, today) {
      const late = o.target_date && o.target_date < today && !['achieved', 'complete', 'met'].includes(String(o.status).toLowerCase())
      const status = PS.canWrite()
        ? h('select', { class: 'inline-sel', 'aria-label': `Status of ${o.id}`, onchange: (e) => PS.act('objective_status', { id: o.id, status: e.target.value }, { done: `${o.id}: ${fmt.label(e.target.value)}` }) },
          (OBJ.includes(o.status) ? OBJ : [o.status || '', ...OBJ]).map((v) => h('option', { value: v, selected: v === o.status, disabled: !OBJ.includes(v) }, fmt.label(v || 'unset'))))
        : PS.statusChip(o.status)
      return h('article', { class: 'panel goal' },
        h('div', { class: 'goal-head' },
          h('div', { class: 'chips' }, PS.idChip(o.id), status, o.category ? PS.chip(fmt.label(o.category)) : null),
          h('h3', { class: 'goal-title', onclick: () => PS.openEntity(o.path, o.title), style: 'cursor:pointer' }, o.title),
          h('div', { class: 'goal-meta' },
            h('span', {}, 'Target ', h('span', { class: 'mono', style: late ? 'color:var(--rose)' : '' }, fmt.date(o.target_date))),
            o.horizon ? h('span', {}, fmt.label(o.horizon)) : null,
            o.owner ? h('span', {}, fmt.person(o.owner)) : null,
            typeof o.confidence === 'number' ? h('span', { class: 'conf', title: 'Confidence' }, 'Confidence ', h('span', { class: 'bar', style: 'width:60px;display:inline-flex;vertical-align:middle' }, h('span', { style: `width:${Math.round(o.confidence * 100)}%;background:var(--terra)` })), ` ${Math.round(o.confidence * 100)}%`) : null)),
        o.narrative ? h('p', { class: 'goal-narr' }, o.narrative) : null,
        o.kpis.length ? h('ul', { class: 'rows kpis' }, o.kpis.map(kpiRow)) : h('div', { class: 'empty' }, 'No KPIs linked yet.'),
        o.milestones.length ? h('div', { class: 'chips goal-ms' }, h('span', { class: 'muted', style: 'font-size:12px' }, 'Milestones'), o.milestones.map((m) => h('span', { class: `chip ${m.done ? 'good' : m.overdue ? 'crit' : ''}`, title: `${m.id} ${m.title || ''} · ${m.status || ''}` }, String(m.id).match(/^[A-Z]+\d+/)?.[0] || m.id))) : null)
    }

    function kpiRow(k) {
      const unit = k.unit && k.unit !== 'count' ? (k.unit === '%' || k.unit === 'percent' ? '%' : ` ${k.unit}`) : ''
      const pct = k.attainment == null ? null : Math.round(k.attainment * 100)
      const arrow = k.trend > 0 ? '↑' : k.trend < 0 ? '↓' : '→'
      const good = k.trend === 0 ? '' : (k.trend > 0) === (String(k.direction).toLowerCase() !== 'down') ? 'good' : 'crit'
      return h('li', { class: 'row kpi clickable', onclick: () => PS.openEntity(k.path, k.metric) },
        h('span', { class: 'kpi-spark' }, spark(k)),
        h('span', { class: 'what' }, h('div', { class: 'title' }, k.metric),

// shared: a 2D bar strip drawn to one scale, with a faint grid and an emphasised last bar
PS.bars = function bars(points, { value, label, fmtv = (x) => x, height = 120, color = 'var(--terra)' }) {
  const W = 960, H = height, P = 26, n = points.length
  const max = Math.max(1e-9, ...points.map(value))
  const bw = (W - P * 2) / Math.max(1, n)
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  s.setAttribute('viewBox', `0 0 ${W} ${H + 22}`); s.setAttribute('role', 'img'); s.setAttribute('style', 'width:100%;height:auto;display:block')
  const add = (tag, a, text) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (text != null) e.textContent = text; s.append(e); return e }
  for (const f of [0.5, 1]) { const y = H - (H - 10) * f; add('line', { x1: P, x2: W - P, y1: y, y2: y, stroke: 'var(--rule-soft)' }); add('text', { x: 2, y: y + 4, 'font-size': 10, fill: 'var(--mid-2)', 'font-family': 'var(--ps-mono)' }, fmtv(max * f)) }
  add('line', { x1: P, x2: W - P, y1: H, y2: H, stroke: 'var(--rule)' })
  points.forEach((p, i) => {
    const v = value(p), bh = ((H - 10) * v) / max, x = P + i * bw + 1
    const r = add('rect', { x, y: H - bh, width: Math.max(1, bw - 2), height: bh, fill: color, opacity: i === n - 1 ? 1 : 0.62 })
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); t.textContent = `${label(p)}: ${fmtv(v)}`; r.append(t)
    if (n <= 31 && (i % Math.ceil(n / 8) === 0 || i === n - 1)) add('text', { x: x + bw / 2, y: H + 15, 'font-size': 10, fill: 'var(--mid)', 'text-anchor': 'middle', 'font-family': 'var(--ps-mono)' }, label(p))
  })
  return s
}

// The research capability in the Console (docs/RESEARCH-CAPABILITY-SPEC.md §10): four linked views over one model —
// view_capability research returns capabilities/research/views/_research.py model(), the same derivation the
// At a glance, Timeline and Evidence reports draw, so the Console and the reports never disagree.
//   At a glance  the questions, what is waiting on a person, the headline numbers
//   Dashboard    evidence health per mandate: the gate gauge, the tier mix, provisional and untriangulated counts,
//                challenges, productive vs barren steps; the activity spine; the tier × status matrix
//   Timeline     every mandate's life on one lane, interactive: filter mandates, choose the window, hover any mark,
//                click a finding or challenge to open its record; past today, when each question's evidence goes stale
//   Evidence     the findings register, filterable by tier, status, freshness and mandate, searchable, sorted by the
//                day each finding goes stale
//   Library      the results: each mandate's study and the articles compiled across mandates, on shelves with a health
//                bar each; open one to read it in place, every citation checked against today's evidence (superseded,
//                challenged, stale, provisional flagged in the text and in the ledger beside it)

    // ── helpers ─────────────────────────────────────────────────────────────
    // research's own palette (declared on .rs in RS_CSS): the Console's accent is one warm hue, and a timeline needs
    // tiers, phases, changes and challenges told apart at a glance, in light and dark themes alike
    const TIER = { primary: 'var(--rs-t1)', secondary: 'var(--rs-t2)', tertiary: 'var(--rs-t3)', speculative: 'var(--rs-t4)' }
    const QST = { answered: 'good', aging: 'warn', stale: 'crit', reopened: 'crit', open: '', dropped: '' }
    const PHASE = { draft: 'var(--mid-2)', locked: 'var(--rs-lock)', 'in-progress': 'var(--terra)', standing: 'var(--rs-change)', complete: 'var(--rs-t1)', 'closed-negative': 'var(--rs-t1)', killed: 'var(--rose)' }
    const FAM = { mandate: 'var(--mid-2)', step: 'var(--rs-step)', barren: 'var(--amber)', finding: 'var(--rs-t1)', red: 'var(--rose)', change: 'var(--rs-change)', ship: 'var(--terra)', gate: 'var(--ink)' }
    const sv = (tag, attrs = {}, ...kids) => { const n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v); for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k))); return n }
    const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000)
    const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10) }
    const tierBar = (tiers, total, w = 120) => h('span', { class: 'rs-tb', style: `width:${w}px` }, ['primary', 'secondary', 'tertiary', 'speculative'].map((t) => tiers?.[t] ? h('i', { style: `background:${TIER[t]};width:0`, 'data-grow': `${(100 * tiers[t]) / Math.max(1, total)}%`, title: `${tiers[t]} ${t}` }) : null))
    const tip = h('div', { class: 'rs-tip', role: 'tooltip' })
    const hover = (node, html) => { node.addEventListener('mouseenter', (e) => { tip.innerHTML = html; tip.style.opacity = 1; move(e) }); node.addEventListener('mousemove', move); node.addEventListener('mouseleave', () => { tip.style.opacity = 0 }) }
    function move(e) { const r = body.getBoundingClientRect(); tip.style.left = `${Math.min(e.clientX - r.left + 14, r.width - 300)}px`; tip.style.top = `${e.clientY - r.top + 14}px` }
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

    // ── At a glance ─────────────────────────────────────────────────────────
    function glance(d) {
      const c = d.counts
      const sevCls = { urgent: 'crit', soon: 'warn', ondeck: '' }

        d.fixture ? h('div', { class: 'callout warn' }, h('b', {}, 'Sample data. '), 'Every fact on this page is invented; it shows the shape of what you get.') : null,
        h('div', { class: 'stats' }, PS.tile(c.mandates_active, 'active mandates'), PS.tile(h('span', {}, c.answered, h('small', {}, `/${c.questions}`)), 'questions answered', c.answered === c.questions ? 'good' : ''),
          PS.tile(c.established, 'established findings', 'good'), PS.tile(c.provisional, 'provisional', c.provisional ? 'warn' : ''),

          h('div', { class: 'rs-mandates' }, d.mandates.map((m) => h('article', { class: 'rs-m' },
            h('header', {}, h('span', { class: `chip rs-ph`, style: `--c:${PHASE[m.status] || 'var(--mid)'}` }, m.status + (m.cadence ? ` · ${m.cadence}` : '')), h('button', { class: 'rs-link mono', onclick: () => openM(m.id) }, m.id),
              h('b', {}, m.headline), h('span', { class: 'chip' }, m.type), m.status === 'draft' ? PS.chip(`iteration ${m.iteration}`, 'warn') : null),

    // ── Dashboard ───────────────────────────────────────────────────────────
    function gauge(g) {
      const r = 34, C = 2 * Math.PI * r * 0.75, share = g.share ?? 0, thr = g.threshold ?? 0.5
      const ok = g.verdict === 'pass'
      const arc = (frac) => `${C * frac} ${2 * Math.PI * r}`
      const tAng = (-225 + 270 * thr) * Math.PI / 180
      const s = sv('svg', { viewBox: '0 0 90 80', class: 'rs-gauge', role: 'img', 'aria-label': `primary share ${Math.round(100 * share)}% against a ${Math.round(100 * thr)}% gate` },
        sv('circle', { cx: 45, cy: 44, r, fill: 'none', stroke: 'var(--raised-2)', 'stroke-width': 8, 'stroke-dasharray': arc(1), transform: 'rotate(135 45 44)', 'stroke-linecap': 'round' }),
        sv('circle', { class: 'rs-arc', cx: 45, cy: 44, r, fill: 'none', stroke: g.share == null ? 'var(--mid-2)' : ok ? 'var(--green)' : 'var(--amber)', 'stroke-width': 8, 'stroke-dasharray': arc(0), 'data-dash': arc(share), transform: 'rotate(135 45 44)', 'stroke-linecap': 'round' }),
        sv('line', { x1: 45 + (r - 7) * Math.cos(tAng), y1: 44 + (r - 7) * Math.sin(tAng), x2: 45 + (r + 7) * Math.cos(tAng), y2: 44 + (r + 7) * Math.sin(tAng), stroke: 'var(--ink)', 'stroke-width': 2 }),
        sv('text', { x: 45, y: 48, 'text-anchor': 'middle', class: 'rs-gv' }, g.share == null ? '—' : `${Math.round(100 * share)}%`),
        sv('text', { x: 45, y: 74, 'text-anchor': 'middle', class: 'rs-gl' }, `gate ${Math.round(100 * thr)}%`))
      requestAnimationFrame(() => { const a = s.querySelector('.rs-arc'); a.setAttribute('stroke-dasharray', a.dataset.dash) })
      return s
    }
    function spine(d) {
      const end = d.as_of, start = addDays(end, -59)
      const byDay = {}
      for (const e of d.spine) if (e.date >= start) (byDay[e.date] ||= {})[e.family] = e.n
      const max = Math.max(1, ...Object.values(byDay).map((o) => Object.values(o).reduce((a, b) => a + b, 0)))
      const W = 600, H = 120, bw = W / 60
      const s = sv('svg', { viewBox: `0 0 ${W} ${H + 18}`, class: 'rs-spine', role: 'img', 'aria-label': 'Research activity, last 60 days' })
      for (let i = 0; i < 60; i++) {
        const day = addDays(start, i), o = byDay[day] || {}
        let y = H
        for (const f of d.families.map((x) => x.id)) {
          const n = o[f] || 0
          if (!n) continue
          const hh = (H - 6) * n / max
          const r = sv('rect', { x: i * bw + 1, y: y - hh, width: bw - 2, height: hh, fill: FAM[f], rx: 1, class: 'rs-grow', style: `animation-delay:${i * 8}ms` })
          hover(r, `<b>${day}</b><br>${n} × ${esc(d.families.find((x) => x.id === f).label)}`)
          s.append(r)

    }
    function matrix(d) {
      const tiers = ['primary', 'secondary', 'tertiary', 'speculative'], sts = ['established', 'provisional', 'withdrawn']
      const live = d.findings.filter((f) => f.live || f.status === 'withdrawn')
      const n = (t, s) => live.filter((f) => f.tier === t && f.status === s).length
      const max = Math.max(1, ...tiers.flatMap((t) => sts.map((s) => n(t, s))))
      return h('div', { class: 'rs-mx' }, h('span', {}), sts.map((s) => h('span', { class: 'rs-mxh' }, s)),
        tiers.map((t) => [h('span', { class: 'rs-mxh', style: 'text-align:right' }, t), sts.map((s) => {
          const v = n(t, s)

        })]).flat())
    }
    function dashboard(d) {
      const ch = d.challenges
      const bySev = (m) => ['blocking', 'material', 'minor'].map((s) => ch.filter((c) => c.mandate === m && c.status === 'open' && c.severity === s).length)
      return [
        h('div', { class: 'rs-cards' }, d.mandates.filter((m) => m.status !== 'draft').map((m) => {
          const [b, ma, mi] = bySev(m.id)

            h('header', {}, h('span', { class: 'chip rs-ph', style: `--c:${PHASE[m.status]}` }, m.status), h('button', { class: 'rs-link mono', onclick: () => openM(m.id) }, m.id)),
            h('div', { class: 'rs-hl' }, m.headline),

            h('div', { class: 'chips' }, b ? PS.chip(`${b} blocking`, 'crit') : null, ma ? PS.chip(`${ma} material`, 'warn') : null, mi ? PS.chip(`${mi} minor`) : null, !(b + ma + mi) ? PS.chip('no open challenge', 'good') : null,
              m.gate.verdict === 'pass' && !m.blocking.length ? PS.chip('may ship', 'good') : PS.chip(m.blocking.length ? 'blocked' : m.gate.verdict, 'warn')))
        })),

          sec('Where is the evidence strong?', 'findings by source tier and status — click a cell to open those findings', matrix(d))),
        sec('Challenges', `${ch.filter((c) => c.status === 'open').length} open — only a person rules`, h('div', { class: 'rs-lanes' }, ['open', 'accepted', 'rejected', 'resolved'].map((st) => h('div', { class: 'rs-lane' },
          h('div', { class: 'eyebrow' }, `${st} · ${ch.filter((c) => c.status === st).length}`),
          ch.filter((c) => c.status === st).map((c) => h('button', { class: `rs-ch sev-${c.severity}`, onclick: () => openC(c.id) }, h('span', { class: 'mono' }, `${c.id} · ${c.finding}`), h('span', {}, c.kind.replace(/-/g, ' ')),

      ]
    }

    // ── Timeline ────────────────────────────────────────────────────────────
    function timeline(d) {
      const mands = d.mandates.filter((m) => !state.hidden.has(m.id))
      const today = d.as_of
      const earliest = [...d.mandates.map((m) => m.created), ...d.findings.map((f) => f.created)].filter(Boolean).sort()[0] || addDays(today, -60)
      const from = state.window === 'all' ? addDays(earliest, -3) : addDays(today, -Number(state.window))
      const horizon = state.horizon ? 120 : 0
      const W = 1000, X0 = 170, XM = X0 + (state.horizon ? 0.72 : 1) * (W - 10 - X0), X1 = W - 10
      const X = (dd) => dd <= today ? X0 + (XM - X0) * Math.max(0, days(from, dd)) / Math.max(1, days(from, today)) : XM + (X1 - XM) * Math.min(1, days(today, dd) / Math.max(1, horizon))
      const LH = 88, H = 34 + LH * Math.max(1, mands.length) + 20
      const s = sv('svg', { viewBox: `0 0 ${W} ${H}`, class: 'rs-tl', role: 'img', 'aria-label': 'Research timeline' })
      if (state.horizon) s.append(sv('rect', { x: XM, y: 22, width: X1 - XM, height: H - 42, fill: 'var(--rs-horizon)' }))
      const span = days(from, today), step = span > 150 ? 30 : span > 60 ? 14 : 7
      for (let dd = from; dd <= today; dd = addDays(dd, step)) s.append(sv('line', { x1: X(dd), y1: 22, x2: X(dd), y2: H - 20, stroke: 'var(--rule-soft)' }), sv('text', { x: X(dd) + 3, y: 16, class: 'rs-ax' }, fmt.short(dd)))
      if (state.horizon) for (const n of [30, 60, 90, 120]) s.append(sv('text', { x: X(addDays(today, n)) - 2, y: 16, class: 'rs-ax', 'text-anchor': 'end' }, `+${n}d`))
      const fz = Object.fromEntries(d.findings.map((f) => [f.id, f]))
      mands.forEach((m, i) => {
        const y = 28 + i * LH, g = sv('g', { class: 'rs-lanegroup', style: `animation-delay:${i * 60}ms` })
        g.append(sv('rect', { x: 0, y, width: W, height: LH - 4, rx: 4, fill: i % 2 ? 'var(--raised-2)' : 'var(--raised)' }))
        const lab = sv('text', { x: 8, y: y + 17, class: 'rs-lab' }, m.id)
        g.append(lab, sv('text', { x: 8, y: y + 31, class: 'rs-sub' }, `${m.status}${m.cadence ? ' · ' + m.cadence : ''}`), sv('text', { x: 8, y: y + 45, class: 'rs-sub' }, `${m.established} est · ${m.provisional} prov`))
        hover(lab, `<b>${esc(m.id)}</b> ${esc(m.status)}<br>${esc(m.headline)}`)
        for (const sp of m.lifecycle) {
          if (['complete', 'closed-negative', 'killed'].includes(sp.phase)) { const xe = X(sp.from); const f = sv('path', { d: `M${xe},${y + 4} v18 M${xe},${y + 4} l11,5 l-11,5`, fill: PHASE[sp.phase], stroke: PHASE[sp.phase], 'stroke-width': 2 }); hover(f, `<b>${sp.phase}</b> on ${sp.from}`); g.append(f); continue }
          const a = sp.from < from ? from : sp.from, b = sp.to || today
          if (b < from) continue
          const r = sv('rect', { x: X(a), y: y + 6, width: Math.max(3, X(b) - X(a)), height: 13, rx: 3, fill: PHASE[sp.phase] })
          hover(r, `<b>${sp.phase}</b><br>${sp.from} → ${sp.to || 'today'}`)
          g.append(r)
          if (X(b) - X(a) > 70) g.append(sv('text', { x: X(a) + 5, y: y + 16, class: 'rs-ph' }, sp.phase))
        }
        for (const st of d.steps.filter((z) => z.mandate === m.id && z.started >= from)) {
          const r = sv('rect', { x: X(st.started) - 3, y: y + 25, width: 6, height: 9, rx: 1, fill: st.barren ? 'none' : 'var(--rs-step)', stroke: st.barren ? 'var(--amber)' : 'var(--rs-step)', 'stroke-width': 1.5 })
          hover(r, `<b>${st.id}</b> · ${st.mode} · ${st.started}<br>${esc(st.description)}<br>${st.barren ? '<i>barren: found nothing</i>' : st.findings + ' finding(s)'}`)
          g.append(r)
        }
        const placed = {}, xy = {}
        for (const f of d.findings.filter((z) => z.mandate === m.id && z.created >= from).sort((a, b) => a.created.localeCompare(b.created))) {
          const x = X(f.created), k = Math.round(x / 7), dy = placed[k] = (placed[k] ?? -1) + 1
          const cy = y + 44 + (dy % 4) * 8
          xy[f.id] = [x, cy]
          const c = sv('circle', { cx: x, cy, r: 4, fill: f.status === 'established' ? TIER[f.tier] : 'var(--raised)', stroke: TIER[f.tier], 'stroke-width': 1.6, opacity: f.live ? 1 : 0.35, class: 'rs-dotf' })
          hover(c, `<b>${f.id}</b> · ${f.tier} · ${f.confidence} · ${f.epistemic}<br>${esc(f.claim)}<br><span class="rs-tipm">${f.status} · ${f.freshness}${f.superseded_by ? ' · superseded by ' + f.superseded_by : ''} · stale ${f.stale_on || '—'}</span>`)
          c.addEventListener('click', () => openF(f.id))
          g.append(c)
        }
        for (const f of d.findings.filter((z) => z.mandate === m.id && z.supersedes && xy[z.id] && xy[z.supersedes])) {
          const [ax, ay] = xy[f.supersedes], [bx, by] = xy[f.id]
          g.append(sv('path', { d: `M${ax},${ay} C${(ax + bx) / 2},${ay - 14} ${(ax + bx) / 2},${by - 14} ${bx},${by}`, fill: 'none', stroke: 'var(--rs-change)', 'stroke-dasharray': '3 2' }))
        }
        d.challenges.filter((c) => c.mandate === m.id).forEach((c, j) => {
          const a = c.created < from ? from : c.created, e = c.ruled || (c.status === 'open' ? today : c.created)
          if (e < from) return
          const yy = y + LH - 12 - (j % 3) * 4
          const l = sv('line', { x1: X(a), y1: yy, x2: Math.max(X(e), X(a) + 4), y2: yy, stroke: c.severity === 'blocking' ? 'var(--rose-deep)' : c.status === 'open' ? 'var(--rose)' : 'var(--mid-2)', 'stroke-width': c.severity === 'blocking' ? 3.5 : 2, 'stroke-linecap': 'round', class: 'rs-chl' })
          hover(l, `<b>${c.id}</b> · ${c.kind} · ${c.severity} · ${c.status}<br>${esc(c.argument)}${c.proposed ? '<br><i>proposed: ' + esc(c.proposed) + '</i>' : ''}`)
          l.addEventListener('click', () => openC(c.id))
          g.append(l)
        })
        for (const x of d.changes.filter((z) => z.mandate === m.id && z.significance !== 'noise' && z.detected_at >= from)) {
          const r = x.significance === 'material' ? 6 : 4, cx = X(x.detected_at)
          const dm = sv('rect', { x: cx - r, y: y + 29 - r, width: 2 * r, height: 2 * r, transform: `rotate(45 ${cx} ${y + 29})`, fill: 'var(--rs-change)' })
          hover(dm, `<b>${x.id}</b> · ${x.significance} · ${x.detected_at}<br>${esc(x.summary)}<br>${x.before.join(', ') || '—'} → ${x.after.join(', ')}`)
          g.append(dm)
        }
        if (state.horizon) for (const q of m.questions) if (q.stale_on && q.stale_on > today && q.stale_on <= addDays(today, horizon)) {
          const t = sv('g', {}, sv('line', { x1: X(q.stale_on), y1: y + 22, x2: X(q.stale_on), y2: y + 40, stroke: 'var(--amber)', 'stroke-width': 2 }), sv('text', { x: X(q.stale_on) + 3, y: y + 38, class: 'rs-qst' }, q.id))
          hover(t, `<b>${q.id}</b> goes stale on ${q.stale_on}<br>${esc(q.text)}`)
          g.append(t)
        }
        s.append(g)
      })
      s.append(sv('line', { x1: XM, y1: 20, x2: XM, y2: H - 18, stroke: 'var(--ink)', 'stroke-dasharray': '3 3', 'stroke-width': 1.5 }), sv('text', { x: XM - 4, y: H - 6, class: 'rs-ax', 'text-anchor': 'end' }, `today ${today}`))
      const controls = h('div', { class: 'rs-controls' },

.rs-da{font-size:12.5px;color:var(--mid);line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.rs-go{margin-top:auto;font-size:12px;color:var(--terra-deep)}
.rs-flag{font-family:var(--ps-mono);font-size:10.5px;color:var(--rose-deep)}
.rs-hb{display:grid;gap:4px}.rs-hbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--raised-2)}.rs-hbar i{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}

.rs-reader{animation:rs-fade .3s both}.rs-rbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}

@media (prefers-reduced-motion:reduce){.rs *{animation:none!important;transition:none!important}}
