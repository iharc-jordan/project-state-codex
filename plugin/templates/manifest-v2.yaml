# ============================================================================
# PROJECT MANIFEST TEMPLATE — v2.0
#
# This is the v2.0 schema. Compared to v1.x:
#   - Generic project identity at the top.
#   - Stakeholders are first-class (not consortium-specific).
#   - Funder/customer fields live in their own namespaces (loaded per-pack).
#   - phases.preset selects the lifecycle preset; pack profiles can augment.
#   - reporting_matrix_path points to the new stakeholder reporting matrix.
#   - packs_loaded controls which compliance packs are active.
#
# Copy to project-state/manifest.yaml and fill in placeholders.
# ============================================================================

schema_version: 2
manifest_kind: project

project:
  name: "TODO-ProjectName"               # short identifier, e.g., "Ai26.10"
  long_name: "TODO-LongProjectTitle"
  one_liner: |
    TODO — one-paragraph description of what the project does and why.
  # kind: the PRIMARY WORK TYPE — the id of a loaded `axis: work` pack (work-general, work-campaign,
  # work-event, work-ops-cycle, agile-default = Software product). The primary alone supplies the
  # suggested phase preset. Legacy free-text values (grant_consortium, client_engagement, startup,
  # open_source, generic, mixed) stay valid and change nothing. Spec: docs/PROJECT-TYPES-SPEC.md §4.
  kind: "TODO-project-kind"
  start_date: ~                          # YYYY-MM-DD
  end_date: ~                            # YYYY-MM-DD
  packs_loaded: []                       # additive: one work pack + any accountability packs, e.g.
                                         # ["work-event", "sponsor-internal"], ["agile-default", "pic-pcais"]
  reporting_matrix_path: "reporting-matrix.yaml"

# ----------------------------------------------------------------------------
# Stakeholders — first-class in v2.0
#
# Every external-facing party that needs reports, gets routed work, or attends
# meetings. Use stable IDs; the reporting matrix references these.
# ----------------------------------------------------------------------------

stakeholders:
  - id: internal.team
    organization: "TODO-Lead-Org"
    role: "Project Team"
  # Add per-pack stakeholders below; comment out what you don't need.
  # - id: funder.pic
  #   organization: "Protein Industries Canada"
  #   role: "Funder"
  #   contacts:
  #     pm: ~
  #     financial_analyst: ~
  #     director_ip: ~
  # - id: customer.{customer_id}
  #   organization: "TODO-Customer-Name"
  #   role: "Customer"
  #   contacts:
  #     billing: ~
  #     engagement_lead: ~
  # - id: board
  #   organization: "TODO-Company-Board"
  #   role: "Board"
  # - id: investors
  #   organization: "TODO-Investor-List"
  #   role: "Investors"

# ----------------------------------------------------------------------------
# Phases — preset-driven in v2.0
# ----------------------------------------------------------------------------

phases:
  preset: "TODO-preset"                  # agile-default | stage-gate-default | countdown-default | cycle-default
                                         # | grant-default | client-engagement-default | waterfall-default
                                         # | open-source-default | custom
  custom_path: ~                         # if preset == "custom", path to your custom preset yaml
  current_phase: ~                       # set by project-phase-gate
  anchor_date: ~                         # YYYY-MM-DD. The fixed date a countdown preset plans back from
                                         # (launch day, event day). Required only by presets declaring
                                         # requires: [anchor_date]. Seeds dated anchor-Nd and matrix
                                         # deadlines anchored here. PROJECT-TYPES-SPEC §4.

  # Does this project have an end date after which no further work is planned?
  #   terminal   — yes. One pass through the ladder, ending in closeout and archive. The default.
  #   continuous — no. Work arrives in increments (v1, v1.1, next retainer); each gets its own
  #                closure, and closing one opens the next instead of reopening a phase.
  # LEAVE THIS UNSET IF UNSURE. Absent means terminal, is permanently valid, and is never warned
  # about. Only presets that declare cycles_back_to on a phase can be continuous; grant-default
  # cannot, by design. Written by project-phase-gate / project-onboarding, not by hand.
  # Spec: docs/CONTINUOUS-LIFECYCLE-SPEC.md
  lifecycle: ~                           # terminal | continuous | ~ (absent == terminal)

# ----------------------------------------------------------------------------
# Surfaces — last-mile delivery channels (unchanged from v1.1)
# ----------------------------------------------------------------------------

surfaces:
  slack:
    enabled: true
    channels:
      daily_standup: ~
      weekly_report: ~
      alerts: ~
      deploys: ~
  gmail:
    enabled: true
    from_identity: "TODO@email"
    always_draft: true                   # CRITICAL: never auto-send
  google_calendar:
    enabled: true
    calendar_id: "primary"
    # Harvest scope — the calendar harvester imports ONLY events matching these
    # keywords (title/description/attendees). The operator's calendar is personal;
    # with no keywords set, the harvester refuses to import anything.
    harvest:
      keywords: []              # e.g. ["projectname", "funder", "steering committee"]
      window_past_days: 90
      window_future_days: 180
      prune_out_of_scope: true  # remove previously imported gcal events that no longer match
  blog:
    enabled: false
    site_slug: ~
    publication_review_required: true
  website:
    enabled: false
    framework: "nextjs"
    hosting: "vercel"
    production_url: ~
    auto_deploy_on_publish: true
    require_review_for_public: true
    default_visibility: "consortium"

# ----------------------------------------------------------------------------
# Funder / customer namespaces — populated by loaded packs
# ----------------------------------------------------------------------------

# Examples — uncomment the namespace for each pack you load.
#
# funder:
#   pic:
#     project_number: "Ai26.10"
#     program: "PCAIS"
#     governing_document: "Master Project Agreement (MPA)"
#     schedule_a_workbook: "TODO-path/to/workbook.xlsx"
#     contacts:
#       pm: ~
#       financial_analyst: ~
#       director_ip: ~
#
# customer:
#   "{customer_id}":
#     contract_value_cad: 0
#     start_date: ~
#     end_date: ~
#     sow_path: "TODO-path/to/sow.docx"
#     contacts:
#       billing: ~
#       engagement_lead: ~

# ----------------------------------------------------------------------------
# Automation — compiled by project-automator into automation/schedule.yaml
#
# The reporting matrix is the source of truth for WHAT runs. This block
# configures WHERE and WHEN jobs are allowed to run. project-automator
# reads these settings when compiling the schedule.
# ----------------------------------------------------------------------------

automation:
  enabled: true                          # master switch; false → all emitted jobs disabled
  window:
    start: "23:00"                       # earliest start time for cron jobs (local tz)
    end:   "05:00"                       # latest finish time (next-day if end < start)
  timezone: ~                            # IANA tz string, e.g. "America/Vancouver" — REQUIRED
  # on_change: regenerate               # future: auto-recompile when matrix changes
  # schedule_path: "automation/schedule.yaml"   # default output path

# ----------------------------------------------------------------------------
# Heavy-artifacts register — for projects whose code lives beside this facility
#
# Things a tool downloads that are large (test-database binaries, browsers, model
# weights), where each is cached, and the setting that puts it there. Convention:
# one git-ignored .cache/ at the repository root, shared by every app, never
# inside node_modules (a clean install deletes it). Asked once by
# project-onboarding Q1.10 / project-scaffolder Step 5; `project-state validate`
# checks each path is git-ignored.
#   ~   never asked (valid, never reported)
#   []  asked: nothing heavy
# Reference: skills/project-state/references/heavy-artifacts.md (FB-001, issue #47)
# ----------------------------------------------------------------------------

caches: ~
# caches:
#   - artifact: "MongoDB server binary"
#     tool: "mongodb-memory-server"
#     size: "780 MB (Windows), 70 MB (Linux)"
#     path: ".cache/mongodb-memory-server"   # relative to the repository root; must be git-ignored
#     setting: "config.mongodbMemoryServer.downloadDir = ../../.cache/mongodb-memory-server (apps/*/package.json)"
#     used_by: ["apps/web", "apps/app"]      # optional

# ----------------------------------------------------------------------------
# Concurrency model (unchanged from v1.x)
# ----------------------------------------------------------------------------

concurrency:
  model: "shared-drive"
  write_rules: "file-per-entity, frontmatter timestamps, advisory lockfiles, append-only logs"
  lock_ttl_seconds: 300

meta:
  schema_version: 2
  created: ~
  created_by: "TODO@email"
  last_modified: ~
  last_modified_by: ~
