preset_id: client-engagement-default
description: |
  Consulting/client-services engagement lifecycle.

  Continuous-capable: 04-wrap declares cycles_back_to, because a renewed retainer or a follow-on SOW
  is a new increment against the same customer, the same risk register, and the same people — not a
  reopened phase. 05-archive stays a genuine sunset for when the relationship actually ends.
  Continuous behaviour is inert unless the facility declares phases.lifecycle: continuous.
  The phase and increment fields below are the public lifecycle contract.

phases:
  - id: "01-discovery"
    label: "Discovery"
    gate_in: ~
    gate_out: "Customer brief understood; rough scope agreed"

  - id: "02-proposal"
    label: "Proposal & SOW"
    gate_in: "Discovery complete"
    gate_out: "SOW signed; PO received"

  - id: "03-engagement"
    label: "Engagement (Active Work)"
    gate_in: "SOW signed"
    gate_out: "All SOW deliverables accepted by customer"
    required_recurring:
      - "Monthly invoice"
      - "Monthly status update"
      - "Quarterly Business Review"

  - id: "04-wrap"
    label: "Engagement Wrap"
    gate_in: "All deliverables accepted"
    gate_out: "Final invoice paid; engagement closed"
    required_artifacts:
      - "Customer signoff on completion"
      - "Final deliverable handover"
      - "Post-engagement support window setup (if applicable)"
      - "Lessons Learned summary"
    cycles_back_to: "03-engagement"   # increment boundary: renewal or follow-on SOW

  - id: "05-archive"
    label: "Archive"
    gate_in: "Engagement closed"
    gate_out: ~
