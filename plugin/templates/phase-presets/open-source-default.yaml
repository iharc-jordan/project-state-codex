preset_id: open-source-default
description: |
  Community-governed open-source project lifecycle.

  Continuous-capable: 03-maintained declares cycles_back_to, so a project that returns to active
  development opens a new increment rather than reopening a phase. 04-archived stays a genuine
  sunset — archiving an open-source project is a real ending, not an increment boundary.
  Continuous behaviour is inert unless the facility declares phases.lifecycle: continuous.
  The phase and increment fields below are the public lifecycle contract.

phases:
  - id: "01-incubation"
    label: "Incubation"
    gate_in: ~
    gate_out: "First public release; stable governance docs"
  - id: "02-active"
    label: "Active development"
    gate_in: "First public release"
    gate_out: ~
    recurring: true
  - id: "03-maintained"
    label: "Maintenance mode"
    gate_in: "Active development paused; maintainers committed to bug-fix-only"
    gate_out: ~
    cycles_back_to: "02-active"   # increment boundary: a revived project resumes active development
  - id: "04-archived"
    label: "Archived"
    gate_in: "Maintenance ended"
    gate_out: ~
    description: "Repository archived; users redirected to forks or successor projects."
