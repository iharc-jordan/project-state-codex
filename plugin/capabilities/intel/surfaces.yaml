capability: intel
label: Intel
description: Ecosystem and competitive intelligence held natively — entities (the players), append-only signals (the findings), mandates (engagements), and from 1.1 claims (sourced, dated, confidence-rated, append-only) projected into profiles, battlecards, deal briefs and briefs — harvested by research runs and inbox drains, surfaced through the one daily briefing.
version: 1.2.0
entities:
- kind: intel-entity
  label: Entities
  dir: intel/entities
  id_field: id
  title_field: name
  status_field: status
  columns:
  - path: id
    label: ID
  - path: name
    label: Name
  - path: type
    label: Type
  - path: priority
    label: Priority
  - path: status
    label: Status
  - path: last_signal
    label: Last signal
  board:
    lanes:
    - label: Active research
      statuses: [active_research]
    - label: Active engagement
      statuses: [active_engagement]
    - label: Watch
      statuses: [watch]
    - label: Inactive
      statuses: [inactive]
    - label: Archived
      statuses: [archived]
  workspace:
    guide: "You are on the INTEL ENTITY workspace — one player in the ecosystem (vendor, competitor, regulator, partner,\n\
      infrastructure), grounded in its live YAML under intel/entities/INT-E-NNN.yaml. Entities are evolving\n\
      understanding and may be edited; signals are the record and are never edited. A) APPLY edits through\n\
      project-state conventions; type must be one of the manifest's entity_types. B) REPLY with heading (id ·\n\
      type · priority · status), the summary, the last three signals from intel/signals/ citing this entity,\n\
      open mandates, and 2-4 ask follow-ups (e.g. \"Research this entity now\", \"Open a mandate\", \"Archive\").\n"
- kind: intel-signal
  label: Signals
  dir: intel/signals
  id_field: id
  title_field: summary
  status_field: intelligence_value
  columns:
  - path: id
    label: ID
  - path: date
    label: Date
  - path: signal_type
    label: Type
  - path: intelligence_value
    label: Value
  - path: source
    label: Source
  - path: entities_referenced
    label: Entities
  board:
    lanes:
    - label: High
      statuses: [high]
    - label: Medium
      statuses: [medium]
    - label: Low
      statuses: [low]
  workspace:
    guide: "You are on the INTEL SIGNAL workspace — one append-only finding, grounded in its live YAML under\n\
      intel/signals/INT-S-NNN.yaml. Signals are NEVER edited: a correction is a new signal that supersedes this\n\
      one. Confirmed fact and inference are distinguished in the summary. A) The only writes are lineage —\n\
      promoting this signal into a risk, a decision or a document citation records a became: edge here and a\n\
      source: intel:INT-S-NNN on the target. B) REPLY with heading (id · type · value · source · date), the\n\
      summary with fact/inference marked, the entities it references, and 2-4 ask follow-ups (e.g. \"Promote to\n\
      a risk\", \"Supersede with a correction\", \"Show related signals\").\n"
- kind: intel-mandate
  label: Mandates
  dir: intel/mandates
  id_field: id
  title_field: summary
  status_field: status
  columns:
  - path: id
    label: ID
  - path: type
    label: Type
  - path: entity_id
    label: Entity
  - path: status
    label: Status
  board:
    lanes:
    - label: Prospecting
      statuses: [prospecting]
    - label: Proposed
      statuses: [proposed]
    - label: Active
      statuses: [active]
    - label: Stalled
      statuses: [stalled]
    - label: Closed
      statuses: [completed, closed]
- kind: intel-claim
  label: Claims
  dir: intel/claims
  id_field: id
  title_field: statement
  status_field: confidence
  columns:
  - path: id
    label: ID
  - path: subject.entity
    label: Subject
  - path: category
    label: Category
  - path: epistemic_status
    label: Status
  - path: confidence
    label: Confidence
  - path: source.class
    label: Source
  - path: retrieved_at
    label: Retrieved
  board:
    lanes:
    - label: High
      statuses: [high]
    - label: Medium
      statuses: [medium]
    - label: Low
      statuses: [low]
  workspace:
    guide: "You are on the INTEL CLAIM workspace — one append-only, sourced assertion about one entity (the competitive\n\
      layer's atom, capabilities/intel/README.md), grounded in its live YAML under intel/claims/INT-C-NNN.yaml. Claims are\n\
      NEVER edited: a correction is a new claim with supersedes: pointing here; a disagreement is conflicts_with on both\n\
      sides. Freshness is derived from the category half-life, never stored — say fresh / aging / stale with the date.\n\
      A) The only writes are supersede (new claim), record-conflict, and lineage (became: into a risk, decision or\n\
      document). B) REPLY with heading (id · subject · category · epistemic status · confidence · source class ·\n\
      freshness), the statement with the source excerpt, what it supersedes or conflicts with, the projections that\n\
      cite it, and 2-4 follow-ups (e.g. \"Supersede with new evidence\", \"Record a conflict\", \"Regenerate the battlecard\").\n"
