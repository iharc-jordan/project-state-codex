# sred capability — schema extension (entity kinds + directories)
# Registered with the Project State canonical gateway when the capability is enabled.
schema_version: 1
capability: sred

directories:
  - path: "sred/uncertainties/"
    entity_kind: "sred.technological_uncertainty"
    naming: "TU-NN-<slug>.yaml"
    t661_section: "E [242]"
  - path: "sred/experiments/"
    entity_kind: "sred.experiment"
    naming: "EX-NN-<slug>.yaml"
    t661_section: "F [244]"
  - path: "sred/advancements/"
    entity_kind: "sred.technological_advancement"
    naming: "ADV-NN-<slug>.yaml"
    t661_section: "G [246]"
  - path: "sred/cost-tracking/"
    entity_kind: "sred.cost_tracking"
    naming: "<FY>-costs.yaml"
  - path: "sred/inbox/"
    purpose: "harvester-proposed candidate evidence entries awaiting confirmation; never auto-promoted"

files:
  - path: "sred/evidence-log.ndjson"
    kind: append-only-log
    entry_schema:
      required: [date, description, people, logged_at]
      one_of_required: [tu_id, ex_id]
      fields:
        date: "date of the work (not of entry)"
        timestamp: "ISO8601"
        entry_type: "experiment|test|failure|iteration|advancement|meeting|publication|harvested"
        tu_id: "TU-NN or null"
        ex_id: "EX-NN or null"
        adv_id: "ADV-NN or null"
        description: "contemporaneous description of what was done/found"
        people: "[names]"
        milestone_id: "host milestone link"
        record_type: "code_commit|pull_request|github_issue|ci_build|test_output|jira_issue|jira_worklog|confluence_page|design_doc|meeting_note|email|slack_message|gdoc"
        record_reference: "commit hash / PR number / issue key / build id / page id@version / permalink"
        excerpt: "REQUIRED for tier-2 record types — verbatim quote captured at harvest/log time"
        corroborated_by: "optional [{record_type, reference}] — records from OTHER sources evidencing the same work"
        backfilled: "REQUIRED true when logged_at - date > 7 days"
        source: "for entry_type: harvested — {surface, ref} provenance"
        logged_by: "name"
        logged_at: "ISO8601"
  - path: "state/sred.json"
    kind: capability-runtime-state
    schema: "schema/state.schema.json"
  - path: "sred/criteria.yaml"
    kind: project-config
    purpose: |
      Layer 2 innovation criteria — the project's capture lens (candidate uncertainty
      areas, declared-routine boundary, harvester hints). Extends the company layer
      (pack profile innovation-criteria.yaml) which extends the non-editable Layer 0
      baseline (schema/eligibility-baseline.yaml). A capture lens, never an
      eligibility argument — the standard-practice test is field-level.
    template: "templates/criteria.yaml"

# Entity field schemas are defined in skills/project-sred-tracker/SKILL.md (adopted v1.0)
# with these capability-level additions to all three entity kinds:
entity_field_additions:
  all: [review_notes, claim_fy]

# Evidence source tiers — graded by audit durability, not convenience.
# Tier 1 sources carry server-side, third-party timestamps and version history:
# they stand as primary evidence on EX records. Tier 2 sources are editable or
# deletable by the author: they corroborate, and MUST carry a verbatim `excerpt`
# captured at log time plus a permalink, because the source may not survive
# retention policies. The reviewer weights claims resting solely on tier 2 as weak.
evidence_source_tiers:
  tier_1_primary:
    - code_commit          # immutable hash, hosted history
    - pull_request         # review trail, linked issues, merge timestamps
    - github_issue         # server-side timestamps, cross-linked to commits/PRs
    - ci_build             # machine-timestamped pass/fail — failure evidence gold
    - test_output          # retained artifact
    - jira_issue           # server-side created/updated timestamps, changelog
    - jira_worklog         # dated time records against issues
    - confluence_page      # version history; cite as <page-id>@<version>
    - design_doc           # when versioned in the repo
  tier_2_corroborating:
    - slack_message        # editable/deletable; permalink + excerpt required
    - gdoc                 # editable; cite doc id + revision if available, excerpt required
    - meeting_note         # unless filed in the repo (then design_doc)
    - email

# Source-anchoring convention (first-class linking at the source):
# a Jira issue labeled `sred-ex-01` or a Confluence page labeled `sred-tu-02`
# is treated by the harvester as author-asserted linkage — the proposal arrives
# pre-linked to that entity with high confidence. Labels never bypass the
# confirm step; they only pre-fill it.

# Evidence correlation — sources work as a cohort, not as independent streams.
# The harvester joins records across sources on the links dev tooling already
# creates, assembling CLUSTERS around one thread of work. Corroboration =
# independent sources agreeing on the same work in the same window.
evidence_correlation:
  join_keys:
    - "Jira issue key in commit messages, branch names, PR titles (ENG-123)"
    - "PR ↔ issue links (GitHub closes/fixes refs; Jira dev panel)"
    - "ci_build → commit sha → PR → issue"
    - "Confluence page links to/from Jira epics; page refs in issue descriptions"
    - "sred-ex-NN / sred-tu-NN labels on any source (author-asserted anchor)"
  cluster_stub: "sred/inbox/ proposal of shape {suggested_ex|suggested_tu, records: [{record_type, reference, tier, date, excerpt?}], window: {from, to}, corroboration: <distinct source count>}"
  uses:
    - "date corroboration: TU identified_date / EX start_date checked against the cluster's earliest source timestamps"
    - "failed-trial corroboration: ci_build failures on experiment branches are machine-timestamped Section F evidence"
    - "quantified-results anchoring: metrics in the narrative trace to a build/test artifact in the cluster"
    - "gap detection: a high-activity cluster with no linked EX is an uncaptured candidate; a single-source EX gets a corroboration suggestion"

invariants:
  - "every ADV references >=1 TU and >=1 EX (tracker refuses; validator fails)"
  - "every EX references exactly 1 TU"
  - "evidence-log is append-only; corrections are new entries"
  - "an EX belongs to exactly one claim_fy; work spanning FY boundaries splits into per-FY EX records under the same TU"
