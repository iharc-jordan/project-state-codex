capability: tender
label: Tender
description: Public-sector tender discovery, qualification and pursuit.
entities:
- kind: tender
  label: Tenders
  dir: tenders
  id_field: id
  title_field: title
  status_field: workflow.status
  columns:
  - path: id
    label: ID
  - path: title
    label: Title
  - path: workflow.status
    label: Status
  - path: source.portal
    label: Portal
  - path: dates.closing
    label: Closing
  - path: qualification.score
    label: Score
  board:
    lanes:
    - label: Discovered
      statuses:
      - discovered
      - preliminary_match
    - label: Reviewing
      statuses:
      - documents_required
      - under_review
      - qualified
    - label: Bid / No-bid
      statuses:
      - bid_no_bid_pending
    - label: Pursuing
      statuses:
      - pursue
      - preparing_response
      - submitted
    - label: Watching
      statuses:
      - watch
      - partner_opportunity
    - label: Closed
      statuses:
      - awarded
      - unsuccessful
      - dismissed
      - cancelled
      - expired
  workspace:
    guide: "You are on the TENDER workspace — one public-sector tender opportunity, grounded in its live YAML.\n\
      A) APPLY changes the operator asks for through substrate conventions: tenders live in\n   project-state/tenders/t-<year>-<seq>.yaml;\
      \ workflow transitions go through the tender-pipeline\n   skill's validated lifecycle; scoring/qualification\
      \ through tender-qualifier; bid/no-bid is a\n   facility decision entity. Append logs/activity.ndjson for\
      \ every change. `human_approved`\n   fields are reserved for humans — never set them.\nB) REPLY with a short\
      \ read of the tender in the block protocol: heading (title, status ·\n   closing date · score), stat-row (status\
      \ / score / closing / portal), callout for anything\n   applied or proposed, table for mandatory requirements\
      \ when relevant, and 2-4 ask follow-ups\n   (e.g. \"Score this against our profiles\", \"Open a bid/no-bid\
      \ decision\", \"Dismiss — out of scope\").\n"
- kind: tender-profile
  label: Capability profiles
  dir: tenders/profiles
  id_field: id
  title_field: name
  status_field: enabled
  columns:
  - path: id
    label: ID
  - path: name
    label: Name
  - path: enabled
    label: Enabled
  - path: phase
    label: Phase
  workspace:
    guide: 'You are on the CAPABILITY PROFILE workspace — one tender-matching profile, grounded in its live

      YAML (include/exclude phrases and concepts, weights, thresholds). Apply requested edits directly

      to the profile YAML per substrate conventions (weights must sum to 100); reply in the block

      protocol with a heading, a table of include/exclude terms, and ask follow-ups.

      '
# Generated report the app renders in place (the declared-report mechanism, PORTFOLIO-CAPABILITY-SPEC §10.1).
# Built from state by views/build-tender-glance.py after each harvest; script-free and self-contained.
reports:
- id: at-a-glance
  label: At a glance
  latest: tenders/reports/at-a-glance.html
  produced_by: tender-pipeline          # python3 capabilities/tender/views/build-tender-glance.py <facility>
  default: true
  sample: samples/at-a-glance.html      # fixture render — the template shown before the capability is enabled or has harvested
overview: '**Tender gives this project a continuously operating tender desk.**

  It watches Canadian public-sector procurement portals — CanadaBuys, MERX, SaskTenders,

  Saskatchewan GEM, and bids&tenders — and turns matching notices into typed tender

  entities inside this project''s substrate. Every tender is scored against this project''s

  capability profiles, qualified against mandatory requirements, monitored for amendments

  and deadline changes, and moved through a validated pursuit lifecycle ending in a

  bid/no-bid decision. A won tender hands off to project-scaffolder and becomes a

  delivery project; the pursuit record stays here.


  Nothing here is a separate system: tenders ride this project''s activity log, decisions,

  documents registry, notifier, kanban and weekly review — same log, same discipline.

  '
flow:
- skill: tender-harvester
  does: 'Collects notices from feeds, saved-search emails and approved listings into tender entities (status: discovered).
    Tracks per-connector cursors and health; unknown email templates are quarantined, never guessed.'
- skill: tender-qualifier
  does: Scores each tender against the capability profiles (deterministic + semantic with verbatim evidence), extracts
    requirements, flags disqualifiers, dedupes cross-portal copies.
- skill: tender-monitor
  does: Watches followed tenders for amendments, deadline changes and cancellations via the cheapest authoritative
    channel; changes land as typed events and trigger re-qualification.
- skill: tender-pipeline
  does: Moves tenders through the pursuit lifecycle (discovered → … → bid/no-bid → submitted → won/lost), records
    bid/no-bid as facility decisions, creates pursuit tasks and deadline milestones, and spawns the delivery project
    on a win.
setup:
  stages:
  - stage: Enable the capability
    intro: Done at enablement — the capability is on and knows what a good tender looks like for this project.
    steps:
    - label: Capability enabled in this project's manifest
      check:
        type: manifest
        path: enabled
        equals: true
    - label: Capability profiles seeded (what "a good tender" means for this project)
      check:
        type: entity_count
        kind: tender-profile
        min: 1
  - stage: Connect your lead sources
    intro: Leads come from portal saved searches. Email alerts are the primary channel — create them on each portal
      (links and per-portal steps below), and paste the CanadaBuys Atom feed URLs here.
    steps:
    - label: Portal saved-search EMAIL ALERTS created (MERX, SaskTenders, bids&tenders, CanadaBuys)
      check:
        type: manual
      hint: On each portal, create saved searches matching your profiles and turn on email notification — this is
        where most leads come from. Portal links and steps are in Sources & connectors below.
    - label: CanadaBuys saved-search Atom feeds pasted into the manifest
      check:
        type: manifest
        path: sources.canadabuys.feeds.discovery
        nonempty: true
      hint: Create saved searches on CanadaBuys, then paste each Atom feed URL here.
      action:
        type: manifest_add
        path: sources.canadabuys.feeds.discovery
        placeholder: https://canadabuys.canada.ca/.../atom-feed-url
        button: Add feed URL
      links:
      - label: CanadaBuys tender search
        href: https://canadabuys.canada.ca/en/tender-opportunities
  - stage: Route the email
    intro: Portal alert emails must land under the tender label so the harvester can drain them.
    steps:
    - label: Mailbox label declared in the manifest
      check:
        type: manifest
        path: mailbox_label
        nonempty: true
    - label: Gmail filter routes portal alert emails to the tender label
      check:
        type: manual
      hint: Create the filter in Gmail, then apply label tenders/a47 + Skip Inbox.
      action:
        type: copy
        button: Copy filter query
        text: from:(notifications@merx.com OR noreply@sasktenders.ca OR notifications@bidsandtenders.ca OR solicitations-appelsdoffres@canadabuys-achatscanada.canada.ca)
      links:
      - label: Open Gmail filter settings
        href: https://mail.google.com/mail/u/0/#settings/filters
  - stage: Run and verify
    intro: Initialize the connectors, confirm leads flow, and put the harvest on a schedule.
    steps:
    - label: First harvest run (connector cursors initialized)
      check:
        type: state_file
        key: tender_connectors
        nonempty: true
      hint: Runs all configured connectors once and initializes cursors + health.
      action:
        type: run_skill
        button: Run first harvest now
        prompt: 'Run the tender harvest now: /tender-harvester all — initialize connector cursors, report per-connector
          results and health.'
    - label: Email leads flowing — email connectors have processed mail
      check:
        type: connector
        channel: email
        min: 1
      hint: Goes green after a harvest drains at least one portal email. If alerts exist but this stays open, check
        the Gmail label and connector health below.
      action:
        type: run_skill
        button: Drain tender mailbox
        prompt: 'Drain the tender mailbox now: /tender-harvester email — process portal alert emails into tender
          entities; report what was processed and any quarantined templates.'
    - label: Scheduled harvest configured (hourly)
      check:
        type: manual
      hint: Add an hourly scheduled session running /tender-harvester all (see the capability runbooks).
operations: '**Daily rhythm.** The harvester runs hourly on schedule; tender-monitor sweeps followed

  tenders; project-orchestrator''s daily routine flags connectors past their interval,

  tenders closing within 7 days, and qualified tenders awaiting a bid/no-bid decision.


  **Alerts.** The tender-pursuit pack routes notifier events: immediate alerts for

  high-scoring matches and shortened deadlines; a daily digest of new discoveries;

  a weekly Tender Pipeline Review on the project''s meeting cadence.


  **Your part.** Review qualified tenders on the board, open the workspace on anything

  promising, and record bid/no-bid decisions when the pipeline asks. Dismissals need a

  reason code; `human_approved` fields are yours alone — agents never set them.

  '
connectors:
  state_key: tender_connectors
  items:
  - id: canadabuys
    label: CanadaBuys
    channels:
    - feed
    - email
    setup: Saved-search Atom feeds (paste URLs in manifest) + email notifications on saved searches.
    links:
    - label: Tender opportunities
      href: https://canadabuys.canada.ca/en/tender-opportunities
    steps:
    - Search tender opportunities with terms from your capability profiles.
    - Save each search; enable BOTH the Atom feed and email notification.
    - Paste each Atom URL into the setup step above; alerts route to the tender label.
  - id: merx
    label: MERX
    channels:
    - email
    setup: Email is the ONLY channel for MERX — without alerts, MERX leads do not exist.
    links:
    - label: MERX open solicitations
      href: https://www.merx.com/public/solicitations/open
    steps:
    - Sign in to MERX; create saved searches per capability profile theme.
    - Turn email notification ON for each saved search.
    - Confirm alert emails arrive and are picked up by the Gmail filter.
  - id: sasktenders
    label: SaskTenders
    channels:
    - email
    - listing
    setup: Saved-search email alerts + conservative public listing polling (4h politeness interval).
    links:
    - label: SaskTenders search
      href: https://sasktenders.ca/content/public/Search.aspx
    steps:
    - Create an account; save searches matching your profiles; enable email notification.
    - Listing polling runs automatically once connectors are initialized.
  - id: gem
    label: Saskatchewan GEM
    channels:
    - listing
    setup: Public listing polling only (4h interval) — no account or alerts needed.
    links:
    - label: GEM procurement listings
      href: https://sasktenders.ca
    steps:
    - Nothing to set up — polling starts with the first harvest run.
  - id: bidsandtenders
    label: bids&tenders
    channels:
    - email
    - listing
    setup: Saved-search email alerts + approved public search URLs (paste in manifest).
    links:
    - label: bids&tenders portal
      href: https://www.bidsandtenders.ca
    steps:
    - Create an account; save searches; enable email notification.
    - Optionally add approved public search-result URLs to sources.bidsandtenders.search_urls.
version: 1.0.0
enablement:
  defaults:
    pack: tender-pursuit
    mailbox_label: tenders/a47
    sources:
      canadabuys:
        feed: true
        email: true
        feeds:
          discovery: []
          watch: []
      merx:
        email: true
      sasktenders:
        email: true
        listing: true
        listing_interval_hours: 4
      gem:
        listing: true
        listing_interval_hours: 4
      bidsandtenders:
        email: true
        listing: true
        listing_interval_hours: 4
        search_urls: []
    profiles_enabled: []
  scaffold:
  - tenders
  - tenders/profiles
  - tenders/events.ndjson
  - documents/inbox/quarantine
  state_init:
    tender_connectors: {}
    counters:
      tenders: 0
